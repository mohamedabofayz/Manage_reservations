<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نموذج طلب حجز (يدوي)</title>
<style>
  body { font-family: "Tajawal", sans-serif; background: #f7f7f7; padding: 20px; color: #333; margin: 0; }
  .container { max-width: 900px; margin: auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
  h2 { text-align: center; margin-bottom: 20px; color: #444; }
  .row { display: flex; gap: 10px; margin-bottom: 12px; }
  .row input, .row select { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; box-sizing: border-box; }
  .group-title { font-weight: bold; margin-top: 25px; background: #f1f3f5; padding: 10px; border-radius: 6px; border-right: 4px solid #007bff; margin-bottom: 10px; }
  button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #007bff; color: white; font-size: 17px; cursor: pointer; margin-top: 20px; transition: 0.3s; }
  button:hover { background: #005fcc; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  img.logo { width: 180px; display: block; margin: 10px auto 20px auto; }
  #addGuestBtn { background: #28a745; margin-top: 10px; width: auto; display: block; margin-right: auto; margin-left: auto; padding: 10px 30px; }
  #addGuestBtn:hover { background: #218838; }
  #totalField { background-color: #e9ecef; font-weight: bold; color: #333; font-size: 1.1em; text-align: center; }
  
  .invoices-section { margin-top: 40px; border-top: 2px dashed #ddd; padding-top: 20px; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .refresh-btn { background: #6c757d; width: auto; padding: 8px 15px; margin: 0; font-size: 14px; }
  
  .invoice-card { background: #fdfdfd; border: 1px solid #e0e0e0; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
  .invoice-info { text-align: right; }
  .invoice-info strong { display: block; color: #333; font-size: 1.1em; }
  .invoice-info span { font-size: 12px; color: #777; }
  .invoice-link { text-decoration: none; background: #dc3545; color: white; padding: 8px 15px; border-radius: 5px; font-size: 14px; }
  .empty-msg { text-align: center; color: #777; padding: 20px; font-style: italic; }

  @media (max-width: 600px) { .row { flex-direction: column; } }
</style>
</head>
<body>

<div id="loginBox" class="container">
  <img class="logo" src="https://iroom.ai/web/image/website/1/logo/iroom?unique=89c76a1" alt="Logo">
  <h2>تسجيل دخول النظام</h2>
  <form id="loginForm">
    <div class="row"><input type="tel" id="phone" placeholder="رقم الجوال" required></div>
    <div class="row"><input type="password" id="password" placeholder="كلمة المرور" required></div>
    <button type="submit" id="loginBtn">تسجيل الدخول</button>
  </form>
  <p id="loginMsg" style="text-align:center; color:#dc3545;"></p>
</div>

<div id="appBox" class="container" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <img class="logo" src="https://iroom.ai/web/image/website/1/logo/iroom?unique=89c76a1" alt="Logo" style="margin:0; width:120px;">
    <div style="text-align: left;">
      <div>مرحباً، <span id="userName" style="font-weight:bold; color:#007bff;"></span></div>
      <button onclick="logout()" style="background:#dc3545; padding:5px 10px; border-radius:5px; width:auto; font-size:12px; margin-top:5px;">خروج</button>
    </div>
  </div>

  <h2 id="formTitle">نموذج طلب حجز (يدوي)</h2>
  
  <div id="editModeAlert" style="display:none; background:#fff3cd; color:#856404; padding:10px; margin-bottom:15px; border:1px solid #ffeeba; border-radius:5px; text-align:center;">
    أنت الآن في وضع <b>تعديل الفاتورة</b>. <a href="#" onclick="resetFormToDefault(); return false;" style="color:#856404;">إلغاء التعديل</a>
  </div>

  <form id="bookingForm">
    <div class="row">
      <input type="text" name="invoice" id="invoiceNumber" placeholder="رقم الفاتورة" required readonly style="background:#f9f9f9;">
      <input type="text" name="clientName" placeholder="إسم العميل" required>
    </div>
    <div class="row">
      <input type="text" name="clientPhone" placeholder="رقم الجوال" required>
      <input type="text" name="address" placeholder="العنوان">
    </div>
    <div class="row"><input type="email" name="clientEmail" placeholder="البريد الالكتروني"></div>
    <hr>
    <div class="row">
      <input type="text" name="hotelName" placeholder="اسم الفندق" required>
      <input type="text" name="hotelPhone" placeholder="جوال الفندق">
    </div>
    <div class="row">
      <input type="email" name="hotelEmail" placeholder="البريد الفندق">
      <input type="text" name="todayDate" id="todayField" placeholder="تاريخ اليوم" readonly>
    </div>

    <div id="guestContainer"></div>
    <button id="addGuestBtn" type="button" onclick="addGuest()">+ إضافة ضيف</button>
    
    <div class="row" style="margin-top:20px;">
      <label style="padding:10px; font-weight:bold;">الإجمالي الكلي:</label>
      <input type="text" name="total" id="totalField" placeholder="0.00" readonly>
    </div>
    <button type="submit" id="sendBtn">إرسال الطلب وإنشاء الفاتورة</button>
  </form>

  <div class="invoices-section">
    <div class="section-header">
      <h3 style="margin:0;">📂 آخر الفواتير</h3>
      <button type="button" class="refresh-btn" onclick="loadInvoices()">🔄 تحديث</button>
    </div>
    <div id="invoiceList"><p class="empty-msg">جاري التحميل...</p></div>
  </div>
</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBt3Dm6LX1CKwg3Nw1pzz4UeJit6j31GxaON04BmhVXBvWj2ivrjTZ_GB6t-KOtzv0/exec";

let guestCount = 0;
let currentUser = null;
let isEditMode = false;

// --- دالة تنسيق التاريخ للـ HTML Input ---
function formatDateForInput(dateVal) {
  try {
    if (!dateVal) return "";
    let d = new Date(dateVal);
    if (isNaN(d.getTime())) return "";
    // حل مشكلة فرق التوقيت UTC
    const offset = d.getTimezoneOffset();
    d = new Date(d.getTime() - (offset * 60 * 1000));
    return d.toISOString().split('T')[0];
  } catch (e) { return ""; }
}

function generateInvoice() {
  if (isEditMode) return;
  document.getElementById('invoiceNumber').value = "INV-" + Math.floor(Math.random() * 1000000);
  document.getElementById('todayField').value = new Date().toISOString().split('T')[0];
}

function addGuest() {
  guestCount++;
  if (guestCount > 4) { guestCount--; return; }
  
  const div = document.createElement("div");
  div.id = `guest_group_${guestCount}`;
  div.innerHTML = `
    <div class="group-title">بيانات الضيف ${guestCount}</div>
    <div class="row">
      <input name="name${guestCount}" placeholder="اسم الضيف">
      <input type="date" name="checkin${guestCount}" onchange="calcNights(${guestCount})">
    </div>
    <div class="row">
      <input type="date" name="checkout${guestCount}" onchange="calcNights(${guestCount})">
      <input name="nights${guestCount}" placeholder="عدد الليالي" readonly style="background:#eee;">
    </div>
    <div class="row">
      <select name="type${guestCount}">
        <option value="">— نوع الغرفة —</option>
        <option value="مفردة">مفردة</option>
        <option value="مزدوجة">مزدوجة</option>
        <option value="ثلاثية">ثلاثية</option>
        <option value="رباعية">رباعية</option>
        <option value="خماسية">خماسية</option>
      </select>
      <input type="number" name="rooms${guestCount}" value="1" min="1" placeholder="عدد الغرف">
    </div>
    <div class="row">
      <input type="number" name="amount${guestCount}" step="0.01" placeholder="السعر" oninput="calcTotal()">
    </div>
  `;
  document.getElementById('guestContainer').appendChild(div);
  if (guestCount >= 4) {
    document.getElementById('addGuestBtn').disabled = true;
    document.getElementById('addGuestBtn').textContent = 'الحد الأقصى 4 ضيوف';
  }
}

function calcNights(i) {
  const form = document.getElementById('bookingForm');
  const cin = form[`checkin${i}`].value;
  const cout = form[`checkout${i}`].value;
  if (cin && cout) {
    const diff = new Date(cout) - new Date(cin);
    const nights = Math.max(0, diff / (1000 * 60 * 60 * 24));
    form[`nights${i}`].value = nights + " ليلة";
  }
}

function calcTotal() {
  let sum = 0;
  document.querySelectorAll("input[name^='amount']").forEach(i => sum += parseFloat(i.value) || 0);
  document.getElementById('totalField').value = sum.toFixed(2);
}

async function postToGAS(data) {
  const res = await fetch(GOOGLE_SCRIPT_URL, { method: "POST", body: JSON.stringify(data) });
  return await res.json();
}

// --- معالجة الحفظ والتحديث ---
document.getElementById('bookingForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('sendBtn');
  const confirmMsg = isEditMode ? "تأكيد تحديث البيانات؟" : "تأكيد إرسال الطلب؟";
  
  if (!confirm(confirmMsg)) return;
  
  btn.disabled = true;
  btn.textContent = "جاري المعالجة...";

  const formData = new FormData(e.target);
  let data = Object.fromEntries(formData.entries());
  
  // دمج نوع الغرفة والعدد
  for (let i = 1; i <= guestCount; i++) {
    if (data[`type${i}`]) {
      data[`type${i}`] = `${data[`type${i}`]} X ${data[`rooms${i}`] || 1} غرفة`;
    }
  }

  data.action = isEditMode ? "update_invoice" : "create_invoice";
  data.userId = currentUser.id;
  if (isEditMode) data.invoice_no = data.invoice;
  if (isEditMode) data.updated_data = data;

  try {
    const res = await postToGAS(data);
    if (res.status === "success") {
      alert("✅ تمت العملية بنجاح!");
      resetFormToDefault();
      loadInvoices();
    } else { alert("❌ خطأ: " + res.message); }
  } catch (err) { alert("❌ فشل الاتصال"); }
  finally { 
    btn.disabled = false;
    btn.textContent = isEditMode ? "تحديث الفاتورة" : "إرسال الطلب وإنشاء الفاتورة";
  }
};

async function showEditInvoice(invoiceNo) {
  try {
    const res = await postToGAS({ action: "get_invoice_by_number", invoice_no: invoiceNo, phone_number: currentUser.phone_number });
    if (res.status === "success") fillEditForm(res.invoice);
  } catch (e) { alert("حدث خطأ في جلب البيانات"); }
}

function fillEditForm(inv) {
  isEditMode = true;
  document.getElementById('editModeAlert').style.display = "block";
  document.getElementById('formTitle').textContent = "تعديل فاتورة: " + inv.invoice;
  document.getElementById('sendBtn').textContent = "تحديث الفاتورة";
  
  const f = document.getElementById('bookingForm');
  f.invoice.value = inv.invoice;
  f.clientName.value = inv.clientName || '';
  f.clientPhone.value = inv.clientPhone || '';
  f.address.value = inv.address || '';
  f.clientEmail.value = inv.clientEmail || '';
  f.hotelName.value = inv.hotelName || '';
  f.hotelPhone.value = inv.hotelPhone || '';
  f.hotelEmail.value = inv.hotelEmail || '';
  f.todayDate.value = formatDateForInput(inv.todayDate);

  document.getElementById('guestContainer').innerHTML = '';
  guestCount = 0;

  for (let i = 1; i <= 4; i++) {
    if (inv[`name${i}`] || inv[`amount${i}`]) {
      addGuest();
      f[`name${guestCount}`].value = inv[`name${i}`] || '';
      f[`checkin${guestCount}`].value = formatDateForInput(inv[`checkin${i}`]);
      f[`checkout${guestCount}`].value = formatDateForInput(inv[`checkout${i}`]);
      f[`nights${guestCount}`].value = inv[`nights${i}`] || '';
      f[`amount${guestCount}`].value = inv[`amount${i}`] || '';
      
      let rawType = inv[`type${i}`] || '';
      if (rawType.includes(' X ')) {
        f[`type${guestCount}`].value = rawType.split(' X ')[0];
        f[`rooms${guestCount}`].value = rawType.match(/\d+/) ? rawType.match(/\d+/)[0] : 1;
      } else {
        f[`type${guestCount}`].value = rawType;
      }
    }
  }
  calcTotal();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function resetFormToDefault() {
  isEditMode = false;
  document.getElementById('editModeAlert').style.display = "none";
  document.getElementById('formTitle').textContent = "نموذج طلب حجز (يدوي)";
  document.getElementById('sendBtn').textContent = "إرسال الطلب وإنشاء الفاتورة";
  document.getElementById('bookingForm').reset();
  document.getElementById('guestContainer').innerHTML = '';
  guestCount = 0;
  addGuest();
  generateInvoice();
}

// --- تسجيل الدخول والقوائم ---
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  try {
    const res = await postToGAS({ action: "login", phone_number: phone.value, password: password.value });
    if (res.status === "success") {
      currentUser = res.user;
      localStorage.setItem("phone_number", currentUser.phone_number);
      document.getElementById('userName').textContent = currentUser.username;
      document.getElementById('loginBox').style.display = "none";
      document.getElementById('appBox').style.display = "block";
      resetFormToDefault();
      loadInvoices();
    } else { document.getElementById('loginMsg').textContent = res.message; }
  } finally { btn.disabled = false; }
};

async function loadInvoices() {
  const list = document.getElementById('invoiceList');
  list.innerHTML = 'جاري التحميل...';
  try {
    const data = await postToGAS({ action: "get_invoices", userId: currentUser.id, role: currentUser.role });
    if (!data.invoices || data.invoices.length === 0) { list.innerHTML = 'لا توجد فواتير اليوم.'; return; }
    let html = "";
    data.invoices.forEach(inv => {
      html += `
        <div class="invoice-card">
          <div class="invoice-info">
            <strong>${inv.name || 'بدون اسم'}</strong>
            <span>${inv.invoice_no} | ${inv.date}</span>
          </div>
          <div style="display:flex; gap:5px;">
            <a class="invoice-link" target="_blank" href="${inv.link}">PDF</a>
            ${currentUser.role === 'admin' ? `<button onclick="showEditInvoice('${inv.invoice_no}')" style="background:#ffc107; color:black; width:auto; padding:5px 10px; font-size:12px; margin:0;">تعديل</button>` : ''}
          </div>
        </div>`;
    });
    list.innerHTML = html;
  } catch (e) { list.innerHTML = 'فشل تحميل القائمة'; }
}

function logout() {
  localStorage.removeItem("phone_number");
  location.reload();
}

window.onload = async () => {
  const savedPhone = localStorage.getItem("phone_number");
  if (savedPhone) {
    const res = await postToGAS({ action: "check_session", phone_number: savedPhone });
    if (res.status === "success") {
      currentUser = res.user;
      document.getElementById('userName').textContent = currentUser.username;
      document.getElementById('loginBox').style.display = "none";
      document.getElementById('appBox').style.display = "block";
      resetFormToDefault();
      loadInvoices();
    }
  }
};
</script>
</body>
</html>
