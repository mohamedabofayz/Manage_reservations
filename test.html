<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<title>نموذج طلب حجز (يدوي)</title>
<style>
/* احتفظت بتنسيقك، مع تبسيط */
body { font-family: "Tajawal", sans-serif; background: #f7f7f7; padding: 20px; color: #333; }
.container { max-width: 900px; margin: auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
.row { display:flex; gap:10px; margin-bottom:12px; }
.row input, .row select { flex:1; padding:10px; border:1px solid #ccc; border-radius:8px; font-family:inherit; }
.group-title { font-weight:bold; margin-top:25px; background:#f1f3f5; padding:10px; border-radius:6px; border-right:4px solid #007bff; }
button { width:100%; padding:14px; border:none; border-radius:8px; background:#007bff; color:white; font-size:17px; cursor:pointer; margin-top:20px; transition:.3s; }
button:disabled { background:#ccc; cursor:not-allowed; }
#addGuestBtn { background:#28a745; width:auto; padding:10px 30px; margin:10px auto 0; display:block; }
.invoices-section { margin-top:40px; border-top:2px dashed #ddd; padding-top:20px; }
.invoice-card { background:#fdfdfd; border:1px solid #e0e0e0; padding:15px; margin-bottom:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; }
.invoice-link { text-decoration:none; background:#dc3545; color:white; padding:8px 15px; border-radius:5px; font-size:14px; }
.empty-msg { text-align:center; color:#777; padding:20px; font-style:italic; }
@media (max-width:600px){ .row{flex-direction:column;} }
</style>
</head>
<body>
<div id="loginFormContainer" class="container">
  <img class="logo" src="https://iroom.ai/web/image/website/1/logo/iroom?unique=89c76a1" alt="Logo" style="width:180px;display:block;margin:10px auto 20px;">
  <h2 style="text-align:center;">تسجيل دخول النظام</h2>
  <form id="loginForm">
    <div class="row"><input type="tel" id="phone_number" name="phone_number" placeholder="رقم الجوال" required></div>
    <div class="row"><input type="password" id="password" name="password" placeholder="كلمة المرور" required></div>
    <button type="submit">تسجيل الدخول</button>
  </form>
  <div id="loginStatusMessage"></div>
</div>

<div id="bookingFormContainer" style="display:none;" class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
    <img class="logo" src="https://iroom.ai/web/image/website/1/logo/iroom?unique=89c76a1" alt="Logo" style="width:140px;">
    <div>
      <span id="usernameDisplay" style="font-weight:bold;"></span>
      <button type="button" onclick="logout()" style="background:#dc3545;margin-right:10px;padding:8px 15px;border-radius:5px;color:white;border:none;cursor:pointer;">تسجيل خروج</button>
    </div>
  </div>

  <h2>نموذج طلب حجز (يدوي)</h2>
  <form id="bookingForm">
    <div class="row">
      <input type="text" id="invoiceNumber" name="invoice" placeholder="رقم الفاتورة" required>
      <input type="text" name="clientName" placeholder="إسم العميل" required>
    </div>
    <div class="row">
      <input type="text" name="clientPhone" placeholder="رقم الجوال" required>
      <input type="text" name="address" placeholder="العنوان">
    </div>
    <div class="row"><input type="email" name="clientEmail" placeholder="البريد الالكتروني"></div>
    <hr style="margin:20px 0;border:0;border-top:1px solid #eee;">
    <div class="row"><input type="text" name="hotelName" id="hotelName" placeholder="اسم الفندق" required></div>
    <div id="guestContainer"></div>
    <button id="addGuestBtn" type="button">+ إضافة ضيف</button>
    <div class="row" style="margin-top:20px;">
      <label style="padding:10px;align-self:center;font-weight:bold;">الإجمالي الكلي:</label>
      <input type="text" id="totalField" name="total" placeholder="0.00" readonly style="background:#e9ecef;font-weight:bold;">
    </div>
    <button type="submit" id="submitBtn">إرسال الطلب وإنشاء الفاتورة</button>
  </form>

  <div class="invoices-section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
      <h3>📂 فواتير اليوم</h3>
      <button class="refresh-btn" onclick="fetchInvoices()" style="background:#6c757d;padding:8px 15px;color:white;border:none;border-radius:6px;cursor:pointer;">🔄 تحديث</button>
    </div>
    <div id="invoicesList"><p class="empty-msg">جاري تحميل الفواتير...</p></div>
  </div>
</div>

<script>
/* ======== اضبط هنا رابط Web App المنشور ======== */
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBt3Dm6LX1CKwg3Nw1pzz4UeJit6j31GxaON04BmhVXBvWj2ivrjTZ_GB6t-KOtzv0/exec";
/* =============================================== */

/* أدوات مساعدة */
function el(id){ return document.getElementById(id); }
function generateInvoiceNumber(){
  const now = new Date();
  return `IR-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${Math.floor(1000+Math.random()*9000)}`;
}
el('invoiceNumber').value = generateInvoiceNumber();
el('totalField').value = "0.00";

/* ضيوف */
let guestCount = 0;
function addGuest(){
  guestCount++;
  const container = el('guestContainer');
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="group-title">بيانات الضيف ${guestCount}</div>
    <div class="row">
      <input name="name${guestCount}" placeholder="اسم الضيف">
      <input type="date" id="arrive${guestCount}" name="checkin${guestCount}" onchange="calcNights(${guestCount})">
    </div>
    <div class="row">
      <input type="date" id="leave${guestCount}" name="checkout${guestCount}" onchange="calcNights(${guestCount})">
      <input id="nights${guestCount}" name="nights${guestCount}" placeholder="عدد الليالي" readonly>
    </div>
    <div class="row">
      <select name="type${guestCount}" id="type${guestCount}">
        <option value="">— نوع الغرفة —</option>
        <option value="مفردة">مفردة</option>
        <option value="مزدوجة">مزدوجة</option>
        <option value="ثلاثية">ثلاثية</option>
      </select>
      <input type="number" min="1" value="1" name="rooms${guestCount}" id="rooms${guestCount}" placeholder="عدد الغرف">
    </div>
    <div class="row">
      <input type="number" step="0.01" class="amount-field" name="amount${guestCount}" placeholder="السعر" oninput="calcTotal()">
    </div>
  `;
  container.appendChild(div);
}
el('addGuestBtn').addEventListener('click', addGuest);
addGuest();

/* حسابات */
function calcNights(i){
  const a = el(`arrive${i}`).value, l = el(`leave${i}`).value, f = el(`nights${i}`);
  if(a && l){
    const diff = (new Date(l) - new Date(a)) / 86400000;
    f.value = diff > 0 ? diff + " ليلة" : "خطأ في التاريخ";
  }
}
function calcTotal(){
  let sum = 0;
  document.querySelectorAll(".amount-field").forEach(elm => { sum += parseFloat(elm.value) || 0; });
  el('totalField').value = sum.toFixed(2);
}

/* fetch مع timeout + فحص واضح للأخطاء */
async function fetchWithTimeout(url, opts = {}, timeout = 20000){
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  opts.signal = controller.signal;
  try{
    const res = await fetch(url, opts);
    clearTimeout(id);
    return res;
  } catch (err) {
    clearTimeout(id);
    throw err;
  }
}

/* دوال API عامة */
async function postJson(payload){
  if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("PASTE_YOUR")) throw new Error("لم تقم بتحديد GOOGLE_SCRIPT_URL في الكود.");
  const res = await fetchWithTimeout(GOOGLE_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
    mode: "cors"
  }, 20000);
  if(!res.ok) {
    const txt = await res.text().catch(()=>"<non-text>");
    throw new Error(`Server returned ${res.status}: ${txt}`);
  }
  // محاولة قراءة JSON مع تحققات
  const ct = res.headers.get('content-type') || '';
  if(!ct.includes('application/json')) {
    const text = await res.text().catch(()=>"");
    throw new Error("الرد ليس JSON: " + text);
  }
  return res.json();
}

/* تسجيل دخول */
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  const msg = document.getElementById("loginStatusMessage");

  try {
    const res = await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "login",
        phone_number: phone_number.value,
        password: password.value
      })
    });

    const data = await res.json();

    if (data.status === "success") {
      localStorage.setItem("user", JSON.stringify(data.user));
      document.getElementById("usernameDisplay").textContent = data.user.username;
      loginFormContainer.style.display = "none";
      bookingFormContainer.style.display = "block";
      fetchInvoices();
    } else {
      msg.innerHTML = `<p style="color:red">${data.message}</p>`;
    }
  } catch {
    msg.innerHTML = `<p style="color:red">Failed to fetch</p>`;
  }
});


/* إرسال حجز -- توحيد (تأكدنا أنه يوجد handler واحد فقط) */
el('bookingForm').addEventListener('submit', async function(e){
  e.preventDefault();
  if(!currentUser){ alert("يجب تسجيل الدخول أولاً"); return; }
  const btn = el('submitBtn'); const org = btn.innerText; btn.innerText="جاري الحفظ..."; btn.disabled = true;
  try{
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    // دمج الغرفة × العدد
    for(let i=1;i<=guestCount;i++){
      if(data[`type${i}`] && data[`rooms${i}`]) data[`type${i}`] = `${data[`type${i}`]} × ${data[`rooms${i}`]} غرف`;
    }
    data.userId = currentUser.id || null;
    const res = await postJson(data);
    if(res.status === 'success'){
      alert("تم بنجاح! 🎉");
      e.target.reset();
      el('guestContainer').innerHTML = ''; guestCount=0; addGuest();
      el('invoiceNumber').value = generateInvoiceNumber();
      calcTotal();
      fetchInvoices();
    } else throw new Error(res.message || 'خطأ من الخادم');
  } catch(err){
    console.error(err);
    alert("فشل الحفظ: " + err.message);
  } finally {
    btn.innerText = org; btn.disabled = false;
  }
});

/* جلب الفواتير */
async function fetchInvoices(){
  const list = el('invoicesList');
  list.innerHTML = '<p class="empty-msg">جاري التحديث...</p>';
  try{
    const payload = { action: 'get_invoices', userId: currentUser?.id || null, role: currentUser?.role || null };
    const data = await postJson(payload);
    list.innerHTML = '';
    const invoices = data.invoices || [];
    if(invoices.length === 0) { list.innerHTML = '<p class="empty-msg">لا توجد فواتير اليوم.</p>'; return; }
    invoices.reverse().forEach(inv => {
      const div = document.createElement('div'); div.className='invoice-card';
      div.innerHTML = `<div class="invoice-info"><strong>📄 ${inv.name}</strong><span>${inv.date || ''}</span></div><a href="${inv.link||'#'}" target="_blank" class="invoice-link">تحميل PDF</a>`;
      list.appendChild(div);
    });
  } catch(err){
    console.error('fetchInvoices error:', err);
    list.innerHTML = `<p class="empty-msg" style="color:red">فشل تحميل القائمة: ${err.message}</p>`;
  }
}

/* جلسة عند التحميل */
let currentUser = null;
window.onload = async function(){
  const phone = localStorage.getItem('phone_number');
  if(phone){
    try{
      const res = await postJson({ action: 'check_session', phone_number: phone });
      if(res.status === 'success' && res.user){ currentUser = res.user; el('usernameDisplay').textContent = currentUser.username || phone; el('loginFormContainer').style.display='none'; el('bookingFormContainer').style.display='block'; fetchInvoices(); return; }
    } catch(err){ console.warn('session check failed', err); }
  }
  el('loginFormContainer').style.display='block';
};

/* تسجيل خروج */
function logout(){
  localStorage.removeItem('phone_number');
  currentUser = null;
  el('loginFormContainer').style.display='block';
  el('bookingFormContainer').style.display='none';
  el('loginForm').reset();
  el('loginStatusMessage').innerHTML = '';
}
</script>
</body>
</html>
