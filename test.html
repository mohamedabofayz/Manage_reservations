<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نموذج طلب حجز (يدوي)</title>
<style>
  body { font-family: "Tajawal", sans-serif; background: #f7f7f7; padding: 20px; color: #333; margin: 0; }
  .container { max-width: 900px; margin: auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
  h2 { text-align: center; margin-bottom: 20px; color: #444; }
  .row { display: flex; gap: 10px; margin-bottom: 12px; }
  .row input, .row select { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; box-sizing: border-box; }
  .group-title { font-weight: bold; margin-top: 25px; background: #f1f3f5; padding: 10px; border-radius: 6px; border-right: 4px solid #007bff; margin-bottom: 10px; }
  button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #007bff; color: white; font-size: 17px; cursor: pointer; margin-top: 20px; transition: 0.3s; }
  button:hover { background: #005fcc; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  img.logo { width: 180px; display: block; margin: 10px auto 20px auto; }
  #addGuestBtn { background: #28a745; margin-top: 10px; width: auto; display: block; margin-right: auto; margin-left: auto; padding: 10px 30px; }
  #addGuestBtn:hover { background: #218838; }
  #totalField { background-color: #e9ecef; font-weight: bold; color: #333; font-size: 1.1em; text-align: center; }
  
  /* Invoice Section Styles */
  .invoices-section { margin-top: 40px; border-top: 2px dashed #ddd; padding-top: 20px; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .refresh-btn { background: #6c757d; width: auto; padding: 8px 15px; margin: 0; font-size: 14px; }
  .refresh-btn:hover { background: #5a6268; }
  
  .invoice-card { background: #fdfdfd; border: 1px solid #e0e0e0; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
  .invoice-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
  .invoice-info { text-align: right; }
  .invoice-info strong { display: block; margin-bottom: 4px; color: #333; font-size: 1.1em; }
  .invoice-info span { font-size: 12px; color: #777; display: block; }
  .invoice-link { text-decoration: none; background: #dc3545; color: white; padding: 8px 15px; border-radius: 5px; font-size: 14px; white-space: nowrap; margin-right: 10px; }
  .invoice-link:hover { background: #c82333; }
  .empty-msg { text-align: center; color: #777; padding: 20px; font-style: italic; }

  @media (max-width: 600px) { .row { flex-direction: column; } }
</style>
</head>
<body>

<div id="loginBox" class="container">
  <img class="logo" src="https://iroom.ai/web/image/website/1/logo/iroom?unique=89c76a1" alt="Logo">
  <h2>تسجيل دخول النظام</h2>
  <form id="loginForm">
    <div class="row">
      <input type="tel" id="phone" placeholder="رقم الجوال" required>
    </div>
    <div class="row">
      <input type="password" id="password" placeholder="كلمة المرور" required>
    </div>
    <button type="submit" id="loginBtn">تسجيل الدخول</button>
  </form>
  <p id="loginMsg" style="text-align:center; color:#dc3545; margin-top:10px;"></p>
</div>

<div id="appBox" class="container" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <img class="logo" src="https://iroom.ai/web/image/website/1/logo/iroom?unique=89c76a1" alt="Logo" style="margin:0; width:120px;">
    <div style="text-align: left;">
      <div style="margin-bottom:5px;">مرحباً، <span id="userName" style="font-weight:bold; color:#007bff;"></span></div>
      <button onclick="logout()" style="background:#dc3545; padding:5px 15px; border-radius:5px; color:white; border:none; cursor:pointer; font-size:14px; width:auto; margin:0;">تسجيل خروج</button>
    </div>
  </div>

  <h2>نموذج طلب حجز (يدوي)</h2>
  <form id="bookingForm">
    <div class="row">
      <input type="text" name="invoice" id="invoiceNumber" placeholder="رقم الفاتورة" required readonly style="background:#f9f9f9;">
      <input type="text" name="clientName" placeholder="إسم العميل" required>
    </div>
    <div class="row">
      <input type="text" name="clientPhone" placeholder="رقم الجوال" required>
      <input type="text" name="address" placeholder="العنوان">
    </div>
    <div class="row">
      <input type="email" name="clientEmail" placeholder="البريد الالكتروني">
    </div>
    
    <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
    
    <div class="row">
      <input type="text" name="hotelName" placeholder="اسم الفندق" required>
      <input type="text" name="hotelPhone" placeholder="جوال الفندق">
    </div>
    <div class="row">
      <input type="email" name="hotelEmail" placeholder="البريد الفندق">
      <input type="text" name="todayDate" id="todayField" placeholder="تاريخ اليوم" readonly>
    </div>

    <div id="guestContainer"></div>
    
    <button id="addGuestBtn" type="button" onclick="addGuest()">+ إضافة ضيف</button>
    
    <div class="row" style="margin-top:20px;">
      <label style="padding:10px; font-weight:bold; display:flex; align-items:center;">الإجمالي الكلي (شامل الضريبة):</label>
      <input type="text" name="total" id="totalField" placeholder="0.00" readonly>
    </div>
    
    <button type="submit" id="sendBtn">إرسال الطلب وإنشاء الفاتورة</button>
  </form>

  <div class="invoices-section">
    <div class="section-header">
      <h3 style="margin:0;">📂 آخر الفواتير</h3>
      <button type="button" class="refresh-btn" onclick="loadInvoices()">🔄 تحديث</button>
    </div>
    <div id="invoiceList"><p class="empty-msg">جاري التحميل...</p></div>
  </div>
</div>

<script>
// هام: استبدل هذا الرابط برابط Web App الخاص بك بعد عمل Deploy جديد
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBt3Dm6LX1CKwg3Nw1pzz4UeJit6j31GxaON04BmhVXBvWj2ivrjTZ_GB6t-KOtzv0/exec";

let guestCount = 0;
let currentUser = null;

// --- Helper Functions ---

function generateInvoice() {
  // إنشاء رقم عشوائي فريد
  invoiceNumber.value = "INV-" + Math.floor(Math.random() * 1000000);
  // تنسيق التاريخ ليتوافق مع Google Sheet
  const d = new Date();
  todayField.value = d.toISOString().split('T')[0]; 
}

function addGuest() {
  guestCount++;
  // ملاحظة: قمنا بتسمية الحقول مثل amount1, amount2 لتتوافق مع دالة buildInvoiceRow في السكربت
  const div = document.createElement("div");
  div.innerHTML = `
    <div class="group-title">بيانات الضيف ${guestCount}</div>
    <div class="row">
      <input name="name${guestCount}" placeholder="اسم الضيف">
      <input type="date" name="checkin${guestCount}" onchange="calcNights(${guestCount})">
    </div>
    <div class="row">
      <input type="date" name="checkout${guestCount}" onchange="calcNights(${guestCount})">
      <input name="nights${guestCount}" placeholder="عدد الليالي" readonly style="background:#eee;">
    </div>
    <div class="row">
      <select name="type${guestCount}">
        <option value="">— نوع الغرفة —</option>
        <option value="مفردة">مفردة</option>
        <option value="مزدوجة">مزدوجة</option>
        <option value="ثلاثية">ثلاثية</option>
        <option value="رباعية">رباعية</option>
        <option value="خماسية">خماسية</option>
      </select>
      <input type="number" name="rooms${guestCount}" value="1" min="1" placeholder="عدد الغرف">
    </div>
    <div class="row">
      <input type="number" name="amount${guestCount}" step="0.01" placeholder="السعر الإجمالي لهذا الضيف" oninput="calcTotal()" style="border-color: #28a745;">
    </div>
  `;
  guestContainer.appendChild(div);
}

function calcNights(i) {
  const form = document.getElementById('bookingForm');
  const checkin = form[`checkin${i}`].value;
  const checkout = form[`checkout${i}`].value;
  if (checkin && checkout) {
    const diff = new Date(checkout) - new Date(checkin);
    const nights = Math.max(0, diff / (1000 * 60 * 60 * 24));
    form[`nights${i}`].value = nights + " ليلة";
  } else {
    form[`nights${i}`].value = "";
  }
}

function calcTotal() {
  let sum = 0;
  const inputs = document.querySelectorAll("input[name^='amount']");
  inputs.forEach(input => {
    sum += parseFloat(input.value) || 0;
  });
  document.getElementById('totalField').value = sum.toFixed(2);
}

// دالة الاتصال بالسكربت
async function postToGAS(data) {
  try {
    const res = await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      // نستخدم no-cors أحياناً لكن هنا نريد قراءة الرد لذا نستخدم الطريقة العادية
      // تأكد أن السكربت منشور كـ "Anyone"
      body: JSON.stringify(data)
    });
    return await res.json();
  } catch (error) {
    throw new Error("فشل الاتصال بالسيرفر");
  }
}

// --- Event Handlers ---

// تسجيل الدخول
loginForm.onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('loginMsg');
  
  btn.disabled = true;
  btn.textContent = "جاري التحقق...";
  msg.textContent = "";

  try {
    // تعديل المفتاح ليطابق phone_number في السكربت
    const payload = {
      action: "login",
      phone_number: document.getElementById('phone').value,
      password: document.getElementById('password').value
    };

    const data = await postToGAS(payload);

    if (data.status === "success") {
      currentUser = data.user;
      localStorage.setItem("phone_number", currentUser.phone_number); // حفظ الرقم للجلسة
      
      document.getElementById('userName').textContent = currentUser.username;
      document.getElementById('loginBox').style.display = "none";
      document.getElementById('appBox').style.display = "block";
      
      // تهيئة النموذج
      generateInvoice();
      guestContainer.innerHTML = ""; guestCount = 0; addGuest();
      loadInvoices();
    } else {
      msg.textContent = data.message || "خطأ في تسجيل الدخول";
    }
  } catch (err) {
    msg.textContent = "خطأ في الاتصال: " + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "تسجيل الدخول";
  }
};

// إرسال الفاتورة
bookingForm.onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('sendBtn');
  if(!confirm("هل أنت متأكد من إرسال البيانات؟")) return;

  btn.disabled = true;
  btn.textContent = "جاري الإرسال...";

  const formData = new FormData(bookingForm);
  const data = Object.fromEntries(formData.entries());
  
  // إضافة البيانات اللازمة للسكربت
  data.userId = currentUser.id;
  // ملاحظة: لا نرسل action محدد، السكربت سيعتبره إنشاء فاتورة بشكل افتراضي

  try {
    const res = await postToGAS(data);
    
    if (res.status === "success") {
      alert("✅ تم الحفظ بنجاح!");
      bookingForm.reset();
      guestContainer.innerHTML = ""; 
      guestCount = 0; 
      addGuest();
      generateInvoice();
      
      // تحديث القائمة بعد ثانية لضمان المعالجة
      setTimeout(loadInvoices, 1500);
    } else {
      alert("⚠️ حدث خطأ: " + res.message);
    }
  } catch (err) {
    alert("❌ فشل الاتصال: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "إرسال الطلب وإنشاء الفاتورة";
  }
};

// جلب الفواتير
async function loadInvoices() {
  const list = document.getElementById('invoiceList');
  list.innerHTML = '<p class="empty-msg">جاري تحميل الفواتير...</p>';
  
  if (!currentUser) return;

  try {
    const payload = {
      action: "get_invoices",
      userId: currentUser.id,
      role: currentUser.role
    };

    const data = await postToGAS(payload);
    
    if (!data.invoices || data.invoices.length === 0) {
      list.innerHTML = '<p class="empty-msg">لا توجد فواتير مسجلة اليوم.</p>';
      return;
    }

    let html = "";
    data.invoices.forEach(inv => {
      // inv.invoice_no, inv.name, inv.date, inv.link حسب السكربت المصحح
      let buttonsHtml = '';
      if (currentUser && currentUser.role === "admin") {
        buttonsHtml = `<button class="edit-btn" onclick="showEditInvoice('${inv.invoice_no}')">تعديل</button><button class="delete-btn" onclick="deleteInvoice('${inv.invoice_no}')">حذف</button>`;
      }
      html += `
        <div class="invoice-card">
          <div class="invoice-info">
            <strong>${inv.name || 'بدون اسم'}</strong>
            <span>فاتورة: ${inv.invoice_no || '#'} | ${inv.date}</span>
          </div>
          <div style="display: flex; gap: 5px;">
            <a class="invoice-link" target="_blank" href="${inv.link}">عرض PDF</a>
            ${buttonsHtml}
          </div>
        </div>
      `;
    });
    list.innerHTML = html;

    // إضافة أنماط للأزرار
    const style = document.createElement('style');
    style.textContent = `
      .edit-btn, .delete-btn {
        width: auto;
        padding: 8px 12px;
        margin: 0;
        font-size: 14px;
        border-radius: 5px;
        border: none;
        cursor: pointer;
      }
      .edit-btn {
        background: #ffc107;
        color: #212529;
      }
      .edit-btn:hover {
        background: #e0a800;
      }
      .delete-btn {
        background: #dc3545;
        color: white;
      }
      .delete-btn:hover {
        background: #c82333;
      }
    `;
    if (!document.querySelector('#invoice-buttons-style')) {
      style.id = 'invoice-buttons-style';
      document.head.appendChild(style);
    }

  } catch (err) {
    list.innerHTML = '<p class="empty-msg" style="color:red">فشل تحميل القائمة</p>';
    console.error(err);
  }
}

// تسجيل الخروج
async function logout() {
  const phone = localStorage.getItem("phone_number");
  if(phone) {
    // محاولة إبلاغ السيرفر بإنهاء الجلسة
    postToGAS({ action: "logout", phone_number: phone }).catch(()=>{});
  }
  
  currentUser = null;
  localStorage.removeItem("phone_number");
  document.getElementById('loginBox').style.display = "block";
  document.getElementById('appBox').style.display = "none";
  document.getElementById('loginForm').reset();
}

// التحقق من الجلسة عند فتح الصفحة
window.onload = async () => {
  const phone = localStorage.getItem("phone_number");
  if (!phone) return;

  // إظهار رسالة تحميل صغيرة
  document.getElementById('loginMsg').textContent = "استعادة الجلسة...";

  try {
    const res = await postToGAS({ action: "check_session", phone_number: phone });
    
    if (res.status === "success") {
      currentUser = res.user;
      document.getElementById('userName').textContent = currentUser.username;
      document.getElementById('loginBox').style.display = "none";
      document.getElementById('appBox').style.display = "block";
      
      generateInvoice();
      addGuest(); // إضافة صف ضيف واحد افتراضياً
      loadInvoices();
    } else {
      // الجلسة انتهت
      localStorage.removeItem("phone_number");
    }
  } catch (err) {
    console.error("Session check failed", err);
  } finally {
    document.getElementById('loginMsg').textContent = "";
  }
};

// دالة عرض نموذج تعديل الفاتورة
async function showEditInvoice(invoiceNo) {
  // التحقق من صلاحيات المستخدم
  if (!currentUser || currentUser.role !== "admin") {
    alert("لا تملك صلاحيات التعديل - فقط المشرفون يمكنهم تعديل الفواتير");
    return;
  }
  
  // جلب بيانات الفاتورة
  try {
    const payload = {
      action: "get_invoice_by_number",
      invoice_no: invoiceNo,
      phone_number: currentUser.phone_number
    };
    
    const response = await postToGAS(payload);
    if (response.status === "success" && response.invoice) {
      fillEditForm(response.invoice);
    } else {
      alert("فشل في جلب بيانات الفاتورة: " + (response.message || "غير معروف"));
    }
  } catch (err) {
    alert("حدث خطأ أثناء جلب بيانات الفاتورة: " + err.message);
  }
}

// دالة ملء نموذج التعديل
function fillEditForm(invoiceData) {
  // تغيير النموذج إلى وضع التعديل
  document.getElementById('invoiceNumber').value = invoiceData.invoice || '';
  document.getElementById('invoiceNumber').readOnly = true; // لا يمكن تغيير رقم الفاتورة
  
  // ملء الحقول الأخرى
  document.querySelector('[name="clientName"]').value = invoiceData.clientName || '';
  document.querySelector('[name="clientPhone"]').value = invoiceData.clientPhone || '';
  document.querySelector('[name="address"]').value = invoiceData.address || '';
  document.querySelector('[name="clientEmail"]').value = invoiceData.clientEmail || '';
  document.querySelector('[name="hotelName"]').value = invoiceData.hotelName || '';
  document.querySelector('[name="hotelPhone"]').value = invoiceData.hotelPhone || '';
  document.querySelector('[name="hotelEmail"]').value = invoiceData.hotelEmail || '';
  document.querySelector('[name="todayDate"]').value = invoiceData.todayDate || '';
  
  // حذف الضيوف الحاليين وإضافة ضيوف الفاتورة
  document.getElementById('guestContainer').innerHTML = '';
  let guestCount = 0;
  
  // إضافة الضيوف من بيانات الفاتورة (حتى 4 ضيوف)
  for (let i = 1; i <= 4; i++) {
    if (invoiceData[`name${i}`] || invoiceData[`amount${i}`]) {
      guestCount++;
      addGuest();
      
      // ملء حقول الضيف
      const form = document.getElementById('bookingForm');
      if (form.querySelector(`[name="name${guestCount}"]`)) {
        form.querySelector(`[name="name${guestCount}"]`).value = invoiceData[`name${i}`] || '';
        form.querySelector(`[name="checkin${guestCount}"]`).value = invoiceData[`checkin${i}`] || '';
        form.querySelector(`[name="checkout${guestCount}"]`).value = invoiceData[`checkout${i}`] || '';
        form.querySelector(`[name="nights${guestCount}"]`).value = invoiceData[`nights${i}`] || '';
        form.querySelector(`[name="type${guestCount}"]`).value = invoiceData[`type${i}`] || '';
        form.querySelector(`[name="amount${guestCount}"]`).value = invoiceData[`amount${i}`] || '';
      }
    }
  }
  
  // إذا لم تتم إضافة أي ضيف، نضيف ضيف واحد فارغ
  if (guestCount === 0) {
    guestCount = 1;
    addGuest();
  }
  
  // تحديث المجموع
  document.getElementById('totalField').value = invoiceData.total || '0.00';
  
  // تغيير نص الزر إلى "تحديث الفاتورة"
  document.getElementById('sendBtn').textContent = "تحديث الفاتورة";
  document.getElementById('sendBtn').onclick = function(e) {
    e.preventDefault();
    updateInvoice();
  };
}

// دالة تحديث الفاتورة
async function updateInvoice() {
  if (!confirm("هل أنت متأكد من تحديث بيانات الفاتورة؟")) return;
  
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = "جاري التحديث...";
  
  // جمع بيانات النموذج
  const formData = new FormData(document.getElementById('bookingForm'));
  const data = Object.fromEntries(formData.entries());
  
  // إرسال طلب التحديث
  try {
    const payload = {
      action: "update_invoice",
      invoice_no: data.invoice,
      updated_data: data,
      phone_number: currentUser.phone_number
    };
    
    const response = await postToGAS(payload);
    if (response.status === "success") {
      alert("✅ تم تحديث الفاتورة بنجاح!");
      
      // إعادة تعيين النموذج إلى الوضع الافتراضي
      resetFormToDefault();
      
      // تحديث قائمة الفواتير
      loadInvoices();
    } else {
      alert("⚠️ حدث خطأ أثناء التحديث: " + response.message);
    }
  } catch (err) {
    alert("❌ فشل الاتصال أثناء التحديث: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "تحديث الفاتورة";
  }
}

// دالة إعادة تعيين النموذج إلى الحالة الافتراضية
function resetFormToDefault() {
  // إعادة تعيين الأزرار
  document.getElementById('sendBtn').textContent = "إرسال الطلب وإنشاء الفاتورة";
  
  // إزالة الحدث وتعيينه مجددًا
  document.getElementById('sendBtn').onclick = null;
  document.getElementById('bookingForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('sendBtn');
    if(!confirm("هل أنت متأكد من إرسال البيانات؟")) return;

    btn.disabled = true;
    btn.textContent = "جاري الإرسال...";

    const formData = new FormData(bookingForm);
    const data = Object.fromEntries(formData.entries());
    
    // إضافة البيانات اللازمة للسكربت
    data.userId = currentUser.id;
    // ملاحظة: لا نرسل action محدد، السكربت سيعتبره إنشاء فاتورة بشكل افتراضي

    try {
      const res = await postToGAS(data);
      
      if (res.status === "success") {
        alert("✅ تم الحفظ بنجاح!");
        bookingForm.reset();
        guestContainer.innerHTML = ""; 
        guestCount = 0; 
        addGuest();
        generateInvoice();
        
        // تحديث القائمة بعد ثانية لضمان المعالجة
        setTimeout(loadInvoices, 1500);
      } else {
        alert("⚠️ حدث خطأ: " + res.message);
      }
    } catch (err) {
      alert("❌ فشل الاتصال: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "إرسال الطلب وإنشاء الفاتورة";
    }
  };
  
  // إعادة تعيين رقم الفاتورة وجعله قابل للكتابة
  document.getElementById('invoiceNumber').readOnly = false;
  document.getElementById('invoiceNumber').value = '';
  
  // إعادة تعيين الحقول الأخرى
  document.getElementById('bookingForm').reset();
  
  // إزالة جميع الضيوف وإضافة واحد فقط
  document.getElementById('guestContainer').innerHTML = '';
  guestCount = 0;
  addGuest();
  
  // إنشاء رقم فاتورة جديد
  generateInvoice();
}

// دالة حذف الفاتورة
async function deleteInvoice(invoiceNo) {
  // التحقق من صلاحيات المستخدم
  if (!currentUser || currentUser.role !== "admin") {
    alert("لا تملك صلاحيات الحذف - فقط المشرفون يمكنهم حذف الفواتير");
    return;
  }
  
  if (!confirm("هل أنت متأكد من حذف الفاتورة رقم " + invoiceNo + "؟\n\nتحذير: سيتم حذف الفاتورة وملف PDF من جوجل درايف.")) return;
  
  try {
    const payload = {
      action: "delete_invoice",
      invoice_no: invoiceNo,
      phone_number: currentUser.phone_number
    };
    
    const response = await postToGAS(payload);
    if (response.status === "success") {
      alert("✅ تم حذف الفاتورة بنجاح!");
      loadInvoices(); // تحديث القائمة
    } else {
      alert("⚠️ حدث خطأ أثناء الحذف: " + response.message);
    }
  } catch (err) {
    alert("❌ فشل الاتصال أثناء الحذف: " + err.message);
  }
}
</script>
