<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>نموذج طلب حجز (يدوي)</title>

<style>
body { font-family: Tajawal, sans-serif; background:#f7f7f7; padding:20px }
.container { max-width:900px; margin:auto; background:#fff; padding:25px; border-radius:15px; box-shadow:0 3px 10px rgba(0,0,0,.1) }
.row { display:flex; gap:10px; margin-bottom:12px }
.row input, .row select { flex:1; padding:10px; border-radius:8px; border:1px solid #ccc }
button { width:100%; padding:14px; border:none; border-radius:8px; background:#007bff; color:#fff; font-size:16px; cursor:pointer }
button:disabled { background:#aaa }
.logo { width:180px; display:block; margin:10px auto }
.group-title { font-weight:bold; margin:20px 0 10px; background:#f1f3f5; padding:10px; border-radius:6px; border-right:4px solid #007bff }
.invoice-card { background:#fff; border:1px solid #ddd; padding:15px; margin-bottom:10px; border-radius:8px; display:flex; justify-content:space-between }
.invoice-link { background:#dc3545; color:#fff; padding:8px 15px; border-radius:5px; text-decoration:none }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="container">
  <img class="logo" src="https://iroom.ai/web/image/website/1/logo/iroom">
  <h3 style="text-align:center">تسجيل الدخول</h3>

  <form id="loginForm">
    <div class="row">
      <input id="phone" placeholder="رقم الجوال" required>
    </div>
    <div class="row">
      <input id="password" type="password" placeholder="كلمة المرور" required>
    </div>
    <button>دخول</button>
  </form>

  <div id="loginMsg"></div>
</div>

<!-- APP -->
<div id="appBox" class="container" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <strong id="userName"></strong>
    <button onclick="logout()" style="width:auto;background:#dc3545">خروج</button>
  </div>

  <h3 style="text-align:center">نموذج الحجز</h3>

  <form id="bookingForm">
    <div class="row">
      <input id="invoice" name="invoice" required>
      <input name="clientName" placeholder="اسم العميل" required>
    </div>

    <div id="guests"></div>

    <button type="button" onclick="addGuest()">+ إضافة ضيف</button>

    <div class="row">
      <input id="total" name="total" readonly placeholder="الإجمالي">
    </div>

    <button id="sendBtn">إرسال</button>
  </form>

  <h3>فواتير اليوم</h3>
  <div id="invoiceList"></div>
</div>

<script>
/* 🔴 ضع رابط Google Apps Script */
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBt3Dm6LX1CKwg3Nw1pzz4UeJit6j31GxaON04BmhVXBvWj2ivrjTZ_GB6t-KOtzv0/exec";

/* ====== STATE ====== */
let currentUser = null;
let guestCount = 0;

/* ====== HELPERS ====== */
const post = data =>
  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(data)
  }).then(r => r.json());

function invoiceNo() {
  return "IR-" + Date.now();
}

// دالة مساعدة لإرسال البيانات
async function postToGAS(data) {
  const res = await fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(data)
  });
  return res.json();
}

// تسجيل الدخول
loginForm.onsubmit = async e => {
  e.preventDefault();
  loginMsg.textContent = "جاري التحقق...";
  try {
    const data = await postToGAS({
      action: "login",
      phone: phone.value,
      password: password.value
    });
    if (data.status === "success") {
      currentUser = data.user;
      localStorage.setItem("phone", currentUser.phone);
      userName.textContent = currentUser.username;
      loginBox.style.display = "none";
      appBox.style.display = "block";
      loadInvoices();
    } else {
      loginMsg.textContent = data.message;
    }
  } catch(err) {
    loginMsg.textContent = "خطأ في الاتصال: " + err.message;
  }
};

// إرسال نموذج الحجز
bookingForm.onsubmit = async e => {
  e.preventDefault();
  sendBtn.disabled = true;

  const formData = Object.fromEntries(new FormData(bookingForm).entries());
  formData.action = "create_invoice";
  formData.userId = currentUser.id;

  try {
    const res = await postToGAS(formData);
    alert(res.message || "تم");
    bookingForm.reset();
    guests.innerHTML = "";
    guestCount = 0;
    loadInvoices();
  } catch(err) {
    alert("فشل الاتصال: " + err.message);
  } finally {
    sendBtn.disabled = false;
  }
};

// جلب الفواتير
async function loadInvoices() {
  try {
    const data = await postToGAS({ action: "get_invoices", userId: currentUser.id });
    invoiceList.innerHTML = "";
    (data.invoices || []).forEach(inv => {
      invoiceList.innerHTML += `
        <div class="invoice-card">
          <div>${inv.name}<br><small>${inv.date}</small></div>
          <a class="invoice-link" target="_blank" href="${inv.link}">PDF</a>
        </div>`;
    });
  } catch(err) {
    invoiceList.innerHTML = "فشل تحميل الفواتير";
  }
}

// التحقق من الجلسة عند فتح الصفحة
window.onload = async () => {
  const phone = localStorage.getItem("phone");
  if(!phone) return;
  try {
    const res = await postToGAS({ action: "check", phone });
    if(res.status === "success") {
      currentUser = res.user;
      userName.textContent = currentUser.username;
      loginBox.style.display = "none";
      appBox.style.display = "block";
      loadInvoices();
    }
  } catch(err) { console.error(err); }
};
</script>

</body>
</html>
