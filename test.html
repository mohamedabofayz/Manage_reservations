<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام توليد الفواتير الآلي</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
      direction: rtl;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    
    h1 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 30px;
    }
    
    .form-section, .invoices-section {
      margin-bottom: 30px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #34495e;
    }
    
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    
    button {
      background-color: #3498db;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    
    button:hover {
      background-color: #2980b9;
    }
    
    button.delete-btn {
      background-color: #e74c3c;
    }
    
    button.delete-btn:hover {
      background-color: #c0392b;
    }
    
    button.update-btn {
      background-color: #f39c12;
    }
    
    button.update-btn:hover {
      background-color: #d35400;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: right;
    }
    
    th {
      background-color: #34495e;
      color: white;
    }
    
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    
    .hidden {
      display: none;
    }
    
    .login-form {
      max-width: 400px;
      margin: 50px auto;
      padding: 30px;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
    }
    
    .error-message {
      color: #e74c3c;
      margin: 10px 0;
    }
    
    .success-message {
      color: #27ae60;
      margin: 10px 0;
    }
    
    .guest-section {
      border: 1px dashed #ccc;
      padding: 15px;
      margin: 15px 0;
      border-radius: 5px;
    }
    
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.4);
    }
    
    .modal-content {
      background-color: white;
      margin: 5% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      max-width: 800px;
      border-radius: 8px;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .close {
      color: #aaa;
      float: left;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    
    .close:hover {
      color: black;
    }
  </style>
</head>
<body>
  <!-- نموذج تسجيل الدخول -->
  <div id="loginForm" class="login-form">
    <h2>تسجيل الدخول إلى النظام</h2>
    <div id="loginMessages"></div>
    <div class="form-group">
      <label for="phone">رقم الجوال:</label>
      <input type="tel" id="phone" required>
    </div>
    <div class="form-group">
      <label for="password">كلمة المرور:</label>
      <input type="password" id="password" required>
    </div>
    <button onclick="login()">تسجيل الدخول</button>
  </div>

  <!-- واجهة النظام الرئيسية -->
  <div id="mainInterface" class="hidden">
    <h1>نظام توليد الفواتير الآلي</h1>
    
    <!-- قسم إنشاء الفاتورة -->
    <div class="form-section">
      <h2>إنشاء فاتورة جديدة</h2>
      <form id="invoiceForm">
        <div class="form-group">
          <label for="customerName">اسم العميل:</label>
          <input type="text" id="customerName" required>
        </div>
        
        <div class="form-group">
          <label for="customerPhone">هاتف العميل:</label>
          <input type="tel" id="customerPhone" required>
        </div>
        
        <div class="form-group">
          <label for="hotelName">اسم الفندق:</label>
          <input type="text" id="hotelName" required>
        </div>
        
        <div class="form-group">
          <label for="roomType">نوع الغرفة:</label>
          <input type="text" id="roomType" required>
        </div>
        
        <div class="form-row" style="display: flex; gap: 15px;">
          <div class="form-group" style="flex: 1;">
            <label for="checkInDate">تاريخ الدخول:</label>
            <input type="date" id="checkInDate" required onchange="calculateNights()">
          </div>
          
          <div class="form-group" style="flex: 1;">
            <label for="checkOutDate">تاريخ الخروج:</label>
            <input type="date" id="checkOutDate" required onchange="calculateNights()">
          </div>
          
          <div class="form-group" style="flex: 1;">
            <label for="numNights">عدد الليالي:</label>
            <input type="number" id="numNights" min="1" readonly>
          </div>
        </div>
        
        <div class="form-row" style="display: flex; gap: 15px;">
          <div class="form-group" style="flex: 1;">
            <label for="pricePerNight">سعر الليلة:</label>
            <input type="number" id="pricePerNight" min="0" step="0.01" required onchange="calculateTotal()">
          </div>
          
          <div class="form-group" style="flex: 1;">
            <label for="totalAmount">المبلغ الإجمالي:</label>
            <input type="number" id="totalAmount" min="0" step="0.01" readonly>
          </div>
        </div>
        
        <div class="form-row" style="display: flex; gap: 15px;">
          <div class="form-group" style="flex: 1;">
            <label for="amountWithoutTax">المبلغ بدون ضريبة:</label>
            <input type="number" id="amountWithoutTax" min="0" step="0.01" readonly>
          </div>
          
          <div class="form-group" style="flex: 1;">
            <label for="taxAmount">مبلغ الضريبة (15%):</label>
            <input type="number" id="taxAmount" min="0" step="0.01" readonly>
          </div>
        </div>
        
        <!-- قسم إضافة الضيوف -->
        <h3>بيانات الضيوف</h3>
        <div id="guestsContainer">
          <!-- سيتم إضافة حقول الضيوف ديناميكيًا -->
        </div>
        
        <button type="button" onclick="addGuestField()">+ إضافة ضيف</button>
        <button type="button" onclick="removeGuestField()">- إزالة ضيف</button>
        
        <br><br>
        <button type="button" onclick="submitInvoice()">إنشاء فاتورة</button>
        <button type="button" onclick="logout()" style="background-color: #95a5a6;">تسجيل خروج</button>
      </form>
    </div>
    
    <!-- قسم عرض الفواتير -->
    <div class="invoices-section">
      <h2>الفواتير المُنشأة</h2>
      <div id="invoicesTableContainer">
        <table id="invoicesTable">
          <thead>
            <tr>
              <th>م</th>
              <th>التاريخ</th>
              <th>اسم العميل</th>
              <th>هاتف العميل</th>
              <th>اسم الفندق</th>
              <th>نوع الغرفة</th>
              <th>تاريخ الدخول</th>
              <th>تاريخ الخروج</th>
              <th>عدد الليالي</th>
              <th>سعر الليلة</th>
              <th>المبلغ الإجمالي</th>
              <th>العمليات</th>
            </tr>
          </thead>
          <tbody id="invoicesTableBody">
            <!-- سيتم ملء البيانات ديناميكيًا -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- نافذة التعديل -->
  <div id="updateModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeUpdateModal()">&times;</span>
      <h2>تعديل الفاتورة</h2>
      <form id="updateInvoiceForm">
        <input type="hidden" id="updateInvoiceId">
        
        <div class="form-group">
          <label for="updateCustomerName">اسم العميل:</label>
          <input type="text" id="updateCustomerName" required>
        </div>
        
        <div class="form-group">
          <label for="updateCustomerPhone">هاتف العميل:</label>
          <input type="tel" id="updateCustomerPhone" required>
        </div>
        
        <div class="form-group">
          <label for="updateHotelName">اسم الفندق:</label>
          <input type="text" id="updateHotelName" required>
        </div>
        
        <div class="form-group">
          <label for="updateRoomType">نوع الغرفة:</label>
          <input type="text" id="updateRoomType" required>
        </div>
        
        <div class="form-row" style="display: flex; gap: 15px;">
          <div class="form-group" style="flex: 1;">
            <label for="updateCheckInDate">تاريخ الدخول:</label>
            <input type="date" id="updateCheckInDate" required onchange="updateCalculateNights()">
          </div>
          
          <div class="form-group" style="flex: 1;">
            <label for="updateCheckOutDate">تاريخ الخروج:</label>
            <input type="date" id="updateCheckOutDate" required onchange="updateCalculateNights()">
          </div>
          
          <div class="form-group" style="flex: 1;">
            <label for="updateNumNights">عدد الليالي:</label>
            <input type="number" id="updateNumNights" min="1" readonly>
          </div>
        </div>
        
        <div class="form-row" style="display: flex; gap: 15px;">
          <div class="form-group" style="flex: 1;">
            <label for="updatePricePerNight">سعر الليلة:</label>
            <input type="number" id="updatePricePerNight" min="0" step="0.01" required onchange="updateCalculateTotal()">
          </div>
          
          <div class="form-group" style="flex: 1;">
            <label for="updateTotalAmount">المبلغ الإجمالي:</label>
            <input type="number" id="updateTotalAmount" min="0" step="0.01" readonly>
          </div>
        </div>
        
        <div class="form-row" style="display: flex; gap: 15px;">
          <div class="form-group" style="flex: 1;">
            <label for="updateAmountWithoutTax">المبلغ بدون ضريبة:</label>
            <input type="number" id="updateAmountWithoutTax" min="0" step="0.01" readonly>
          </div>
          
          <div class="form-group" style="flex: 1;">
            <label for="updateTaxAmount">مبلغ الضريبة (15%):</label>
            <input type="number" id="updateTaxAmount" min="0" step="0.01" readonly>
          </div>
        </div>
        
        <!-- قسم تعديل الضيوف -->
        <h3>بيانات الضيوف</h3>
        <div id="updateGuestsContainer">
          <!-- سيتم إضافة حقول الضيوف ديناميكيًا -->
        </div>
        
        <button type="button" onclick="addUpdateGuestField()">+ إضافة ضيف</button>
        <button type="button" onclick="removeUpdateGuestField()">- إزالة ضيف</button>
        
        <br><br>
        <button type="button" onclick="updateInvoice()">تحديث الفاتورة</button>
        <button type="button" onclick="closeUpdateModal()">إلغاء</button>
      </form>
    </div>
  </div>

  <script>
    // المتغيرات العامة
    let sessionId = localStorage.getItem('sessionId') || '';
    let userRole = localStorage.getItem('role') || '';
    
    // التحقق من حالة تسجيل الدخول عند تحميل الصفحة
    window.onload = function() {
      if (sessionId) {
        loadInvoices();
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('mainInterface').classList.remove('hidden');
      }
    };

    // تسجيل الدخول
    async function login() {
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      
      if (!phone || !password) {
        showMessage('الرجاء إدخال رقم الجوال وكلمة المرور', 'error');
        return;
      }
      
      try {
        const response = await fetch('/exec?action=login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: `phone=${encodeURIComponent(phone)}&password=${encodeURIComponent(password)}`
        });
        
        const result = await response.json();
        
        if (result.success) {
          sessionId = result.sessionId;
          userRole = result.role;
          localStorage.setItem('sessionId', sessionId);
          localStorage.setItem('role', userRole);
          
          document.getElementById('loginForm').classList.add('hidden');
          document.getElementById('mainInterface').classList.remove('hidden');
          showMessage('تم تسجيل الدخول بنجاح', 'success');
          
          // تهيئة حقول إضافة الضيوف
          initializeGuestFields();
          loadInvoices();
        } else {
          showMessage('رقم الجوال أو كلمة المرور غير صحيحة', 'error');
        }
      } catch (error) {
        showMessage('حدث خطأ أثناء محاولة تسجيل الدخول', 'error');
      }
    }

    // تسجيل الخروج
    function logout() {
      sessionId = '';
      userRole = '';
      localStorage.removeItem('sessionId');
      localStorage.removeItem('role');
      
      document.getElementById('mainInterface').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('phone').value = '';
      document.getElementById('password').value = '';
    }

    // حساب عدد الليالي
    function calculateNights() {
      const checkIn = new Date(document.getElementById('checkInDate').value);
      const checkOut = new Date(document.getElementById('checkOutDate').value);
      
      if (checkIn && checkOut && checkOut >= checkIn) {
        const diffTime = Math.abs(checkOut - checkIn);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        document.getElementById('numNights').value = diffDays;
        calculateTotal(); // حساب المجموع عند تغيير عدد الليالي
      }
    }

    // حساب المبلغ الإجمالي
    function calculateTotal() {
      const pricePerNight = parseFloat(document.getElementById('pricePerNight').value) || 0;
      const numNights = parseInt(document.getElementById('numNights').value) || 0;
      
      const totalAmount = pricePerNight * numNights;
      const taxAmount = totalAmount * 0.15;
      const amountWithoutTax = totalAmount - taxAmount;
      
      document.getElementById('totalAmount').value = totalAmount.toFixed(2);
      document.getElementById('taxAmount').value = taxAmount.toFixed(2);
      document.getElementById('amountWithoutTax').value = amountWithoutTax.toFixed(2);
    }

    // تهيئة حقول الضيوف
    function initializeGuestFields() {
      const container = document.getElementById('guestsContainer');
      container.innerHTML = ''; // مسح الحقول الحالية
      
      // إضافة 4 حقول افتراضية لبيانات الضيوف
      for (let i = 0; i < 4; i++) {
        const guestDiv = document.createElement('div');
        guestDiv.className = 'guest-section';
        guestDiv.innerHTML = `
          <h4>ضيف ${i + 1}</h4>
          <div class="form-row" style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;">
              <label for="guestName${i}">الاسم:</label>
              <input type="text" id="guestName${i}" placeholder="اسم الضيف">
            </div>
            <div class="form-group" style="flex: 1;">
              <label for="guestNationality${i}">الجنسية:</label>
              <input type="text" id="guestNationality${i}" placeholder="جنسية الضيف">
            </div>
            <div class="form-group" style="flex: 1;">
              <label for="guestIdNumber${i}">رقم الهوية:</label>
              <input type="text" id="guestIdNumber${i}" placeholder="رقم هوية الضيف">
            </div>
          </div>
        `;
        container.appendChild(guestDiv);
      }
    }

    // إضافة حقل ضيف
    function addGuestField() {
      const container = document.getElementById('guestsContainer');
      const guestCount = container.children.length;
      
      if (guestCount < 4) {
        const guestDiv = document.createElement('div');
        guestDiv.className = 'guest-section';
        guestDiv.innerHTML = `
          <h4>ضيف ${guestCount + 1}</h4>
          <div class="form-row" style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;">
              <label for="guestName${guestCount}">الاسم:</label>
              <input type="text" id="guestName${guestCount}" placeholder="اسم الضيف">
            </div>
            <div class="form-group" style="flex: 1;">
              <label for="guestNationality${guestCount}">الجنسية:</label>
              <input type="text" id="guestNationality${guestCount}" placeholder="جنسية الضيف">
            </div>
            <div class="form-group" style="flex: 1;">
              <label for="guestIdNumber${guestCount}">رقم الهوية:</label>
              <input type="text" id="guestIdNumber${guestCount}" placeholder="رقم هوية الضيف">
            </div>
          </div>
        `;
        container.appendChild(guestDiv);
      } else {
        showMessage('لا يمكن إضافة أكثر من 4 ضيوف', 'error');
      }
    }

    // إزالة حقل ضيف
    function removeGuestField() {
      const container = document.getElementById('guestsContainer');
      const guestCount = container.children.length;
      
      if (guestCount > 1) {
        container.removeChild(container.lastChild);
      } else {
        showMessage('يجب أن يكون هناك على الأقل ضيف واحد', 'error');
      }
    }

    // إرسال الفاتورة
    async function submitInvoice() {
      // جمع بيانات النموذج
      const formData = new FormData();
      formData.append('sessionId', sessionId);
      formData.append('customerName', document.getElementById('customerName').value);
      formData.append('customerPhone', document.getElementById('customerPhone').value);
      formData.append('hotelName', document.getElementById('hotelName').value);
      formData.append('roomType', document.getElementById('roomType').value);
      formData.append('checkInDate', document.getElementById('checkInDate').value);
      formData.append('checkOutDate', document.getElementById('checkOutDate').value);
      formData.append('numNights', document.getElementById('numNights').value);
      formData.append('pricePerNight', document.getElementById('pricePerNight').value);
      formData.append('totalAmount', document.getElementById('totalAmount').value);
      formData.append('amountWithoutTax', document.getElementById('amountWithoutTax').value);
      formData.append('taxAmount', document.getElementById('taxAmount').value);
      
      // جمع بيانات الضيوف
      for (let i = 0; i < 4; i++) {
        const name = document.getElementById(`guestName${i}`).value;
        const nationality = document.getElementById(`guestNationality${i}`).value;
        const idNumber = document.getElementById(`guestIdNumber${i}`).value;
        
        if (name || nationality || idNumber) {
          formData.append(`guestName${i}`, name);
          formData.append(`guestNationality${i}`, nationality);
          formData.append(`guestIdNumber${i}`, idNumber);
        }
      }
      
      try {
        const response = await fetch('/exec?action=submitInvoice', {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
          showMessage('تم إنشاء الفاتورة بنجاح', 'success');
          document.getElementById('invoiceForm').reset();
          initializeGuestFields(); // إعادة تهيئة حقول الضيوف
          loadInvoices(); // تحديث قائمة الفواتير
        } else {
          showMessage(`خطأ: ${result.error}`, 'error');
        }
      } catch (error) {
        showMessage('حدث خطأ أثناء إنشاء الفاتورة', 'error');
      }
    }

    // تحميل الفواتير
    async function loadInvoices() {
      try {
        const response = await fetch(`/exec?action=getInvoices`);
        const result = await response.json();
        
        if (result.success) {
          displayInvoices(result.invoices);
        } else {
          showMessage(`خطأ في تحميل الفواتير: ${result.error}`, 'error');
        }
      } catch (error) {
        showMessage('حدث خطأ أثناء تحميل الفواتير', 'error');
      }
    }

    // عرض الفواتير في الجدول
    function displayInvoices(invoices) {
      const tbody = document.getElementById('invoicesTableBody');
      tbody.innerHTML = '';
      
      invoices.forEach(invoice => {
        const row = document.createElement('tr');
        
        // تحديد أزرار العمليات بناءً على دور المستخدم
        let actionsCell = '<td>';
        if (userRole === 'admin') {
          actionsCell += `<button class="update-btn" onclick="openUpdateModal(${invoice.id})">تعديل</button>`;
          actionsCell += `<button class="delete-btn" onclick="confirmDelete(${invoice.id})">حذف</button>`;
        }
        
        if (invoice.pdfUrl) {
          actionsCell += `<a href="${invoice.pdfUrl}" target="_blank"><button>PDF</button></a>`;
        }
        actionsCell += '</td>';
        
        row.innerHTML = `
          <td>${invoice.id}</td>
          <td>${invoice.date}</td>
          <td>${invoice.customerName}</td>
          <td>${invoice.customerPhone}</td>
          <td>${invoice.hotelName}</td>
          <td>${invoice.roomType}</td>
          <td>${invoice.checkInDate}</td>
          <td>${invoice.checkOutDate}</td>
          <td>${invoice.numNights}</td>
          <td>${invoice.pricePerNight}</td>
          <td>${invoice.totalAmount}</td>
          ${actionsCell}
        `;
        
        tbody.appendChild(row);
      });
    }

    // وظائف التعديل
    function openUpdateModal(invoiceId) {
      // تحميل بيانات الفاتورة
      fetch(`/exec?action=getInvoices`)
        .then(response => response.json())
        .then(result => {
          if (result.success) {
            const invoice = result.invoices.find(inv => inv.id == invoiceId);
            if (invoice) {
              // ملء الحقول ببيانات الفاتورة
              document.getElementById('updateInvoiceId').value = invoice.id;
              document.getElementById('updateCustomerName').value = invoice.customerName || '';
              document.getElementById('updateCustomerPhone').value = invoice.customerPhone || '';
              document.getElementById('updateHotelName').value = invoice.hotelName || '';
              document.getElementById('updateRoomType').value = invoice.roomType || '';
              document.getElementById('updateCheckInDate').value = invoice.checkInDate || '';
              document.getElementById('updateCheckOutDate').value = invoice.checkOutDate || '';
              document.getElementById('updateNumNights').value = invoice.numNights || '';
              document.getElementById('updatePricePerNight').value = invoice.pricePerNight || '';
              document.getElementById('updateTotalAmount').value = invoice.totalAmount || '';
              document.getElementById('updateAmountWithoutTax').value = invoice.amountWithoutTax || '';
              document.getElementById('updateTaxAmount').value = invoice.taxAmount || '';
              
              // ملء حقول الضيوف
              fillUpdateGuestFields(invoice);
              
              // عرض النافذة
              document.getElementById('updateModal').style.display = 'block';
            } else {
              showMessage('الفاتورة غير موجودة', 'error');
            }
          } else {
            showMessage('خطأ في تحميل بيانات الفاتورة', 'error');
          }
        })
        .catch(error => {
          showMessage('حدث خطأ أثناء تحميل بيانات الفاتورة', 'error');
        });
    }

    // ملء حقول الضيوف في نافذة التعديل
    function fillUpdateGuestFields(invoice) {
      const container = document.getElementById('updateGuestsContainer');
      container.innerHTML = ''; // مسح الحقول الحالية
      
      // تقسيم بيانات الضيوف من السلسلة النصية
      const guestNames = invoice.guestNames ? invoice.guestNames.split(', ') : [];
      const guestNationalities = invoice.guestNationalities ? invoice.guestNationalities.split(', ') : [];
      const guestIdNumbers = invoice.guestIdNumbers ? invoice.guestIdNumbers.split(', ') : [];
      
      // إنشاء حقول الضيوف
      for (let i = 0; i < 4; i++) {
        const guestDiv = document.createElement('div');
        guestDiv.className = 'guest-section';
        guestDiv.innerHTML = `
          <h4>ضيف ${i + 1}</h4>
          <div class="form-row" style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;">
              <label for="updateGuestName${i}">الاسم:</label>
              <input type="text" id="updateGuestName${i}" value="${guestNames[i] || ''}" placeholder="اسم الضيف">
            </div>
            <div class="form-group" style="flex: 1;">
              <label for="updateGuestNationality${i}">الجنسية:</label>
              <input type="text" id="updateGuestNationality${i}" value="${guestNationalities[i] || ''}" placeholder="جنسية الضيف">
            </div>
            <div class="form-group" style="flex: 1;">
              <label for="updateGuestIdNumber${i}">رقم الهوية:</label>
              <input type="text" id="updateGuestIdNumber${i}" value="${guestIdNumbers[i] || ''}" placeholder="رقم هوية الضيف">
            </div>
          </div>
        `;
        container.appendChild(guestDiv);
      }
    }

    // حساب عدد الليالي في نافذة التعديل
    function updateCalculateNights() {
      const checkIn = new Date(document.getElementById('updateCheckInDate').value);
      const checkOut = new Date(document.getElementById('updateCheckOutDate').value);
      
      if (checkIn && checkOut && checkOut >= checkIn) {
        const diffTime = Math.abs(checkOut - checkIn);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        document.getElementById('updateNumNights').value = diffDays;
        updateCalculateTotal(); // حساب المجموع عند تغيير عدد الليالي
      }
    }

    // حساب المبلغ الإجمالي في نافذة التعديل
    function updateCalculateTotal() {
      const pricePerNight = parseFloat(document.getElementById('updatePricePerNight').value) || 0;
      const numNights = parseInt(document.getElementById('updateNumNights').value) || 0;
      
      const totalAmount = pricePerNight * numNights;
      const taxAmount = totalAmount * 0.15;
      const amountWithoutTax = totalAmount - taxAmount;
      
      document.getElementById('updateTotalAmount').value = totalAmount.toFixed(2);
      document.getElementById('updateTaxAmount').value = taxAmount.toFixed(2);
      document.getElementById('updateAmountWithoutTax').value = amountWithoutTax.toFixed(2);
    }

    // إضافة حقل ضيف في نافذة التعديل
    function addUpdateGuestField() {
      const container = document.getElementById('updateGuestsContainer');
      const guestCount = container.children.length;
      
      if (guestCount < 4) {
        const guestDiv = document.createElement('div');
        guestDiv.className = 'guest-section';
        guestDiv.innerHTML = `
          <h4>ضيف ${guestCount + 1}</h4>
          <div class="form-row" style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;">
              <label for="updateGuestName${guestCount}">الاسم:</label>
              <input type="text" id="updateGuestName${guestCount}" placeholder="اسم الضيف">
            </div>
            <div class="form-group" style="flex: 1;">
              <label for="updateGuestNationality${guestCount}">الجنسية:</label>
              <input type="text" id="updateGuestNationality${guestCount}" placeholder="جنسية الضيف">
            </div>
            <div class="form-group" style="flex: 1;">
              <label for="updateGuestIdNumber${guestCount}">رقم الهوية:</label>
              <input type="text" id="updateGuestIdNumber${guestCount}" placeholder="رقم هوية الضيف">
            </div>
          </div>
        `;
        container.appendChild(guestDiv);
      } else {
        showMessage('لا يمكن إضافة أكثر من 4 ضيوف', 'error');
      }
    }

    // إزالة حقل ضيف في نافذة التعديل
    function removeUpdateGuestField() {
      const container = document.getElementById('updateGuestsContainer');
      const guestCount = container.children.length;
      
      if (guestCount > 1) {
        container.removeChild(container.lastChild);
      } else {
        showMessage('يجب أن يكون هناك على الأقل ضيف واحد', 'error');
      }
    }

    // تحديث الفاتورة
    async function updateInvoice() {
      const invoiceId = document.getElementById('updateInvoiceId').value;
      
      // جمع بيانات النموذج
      const formData = new FormData();
      formData.append('sessionId', sessionId);
      formData.append('invoiceId', invoiceId);
      formData.append('customerName', document.getElementById('updateCustomerName').value);
      formData.append('customerPhone', document.getElementById('updateCustomerPhone').value);
      formData.append('hotelName', document.getElementById('updateHotelName').value);
      formData.append('roomType', document.getElementById('updateRoomType').value);
      formData.append('checkInDate', document.getElementById('updateCheckInDate').value);
      formData.append('checkOutDate', document.getElementById('updateCheckOutDate').value);
      formData.append('numNights', document.getElementById('updateNumNights').value);
      formData.append('pricePerNight', document.getElementById('updatePricePerNight').value);
      formData.append('totalAmount', document.getElementById('updateTotalAmount').value);
      formData.append('amountWithoutTax', document.getElementById('updateAmountWithoutTax').value);
      formData.append('taxAmount', document.getElementById('updateTaxAmount').value);
      
      // جمع بيانات الضيوف
      for (let i = 0; i < 4; i++) {
        const name = document.getElementById(`updateGuestName${i}`).value;
        const nationality = document.getElementById(`updateGuestNationality${i}`).value;
        const idNumber = document.getElementById(`updateGuestIdNumber${i}`).value;
        
        if (name || nationality || idNumber) {
          formData.append(`guestName${i}`, name);
          formData.append(`guestNationality${i}`, nationality);
          formData.append(`guestIdNumber${i}`, idNumber);
        }
      }
      
      try {
        const response = await fetch('/exec?action=updateInvoice', {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
          showMessage('تم تحديث الفاتورة بنجاح', 'success');
          closeUpdateModal();
          loadInvoices(); // تحديث قائمة الفواتير
        } else {
          showMessage(`خطأ: ${result.error}`, 'error');
        }
      } catch (error) {
        showMessage('حدث خطأ أثناء تحديث الفاتورة', 'error');
      }
    }

    // إغلاق نافذة التعديل
    function closeUpdateModal() {
      document.getElementById('updateModal').style.display = 'none';
    }

    // تأكيد الحذف
    function confirmDelete(invoiceId) {
      if (confirm('هل أنت متأكد أنك تريد حذف هذه الفاتورة؟ لا يمكن التراجع عن هذا الإجراء.')) {
        deleteInvoice(invoiceId);
      }
    }

    // حذف الفاتورة
    async function deleteInvoice(invoiceId) {
      const formData = new FormData();
      formData.append('sessionId', sessionId);
      formData.append('invoiceId', invoiceId);
      
      try {
        const response = await fetch('/exec?action=deleteInvoice', {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
          showMessage('تم حذف الفاتورة بنجاح', 'success');
          loadInvoices(); // تحديث قائمة الفواتير
        } else {
          showMessage(`خطأ: ${result.error}`, 'error');
        }
      } catch (error) {
        showMessage('حدث خطأ أثناء حذف الفاتورة', 'error');
      }
    }

    // عرض الرسائل
    function showMessage(message, type) {
      const messagesDiv = type === 'error' ? 
        document.querySelector('#loginMessages, .error-message') || document.createElement('div') : 
        document.createElement('div');
      
      // إذا لم يكن هناك عنصر رسائل محدد، ننشئ واحدًا مؤقتًا
      if (!document.contains(messagesDiv) || !messagesDiv.parentElement) {
        messagesDiv.className = type === 'error' ? 'error-message' : 'success-message';
        // نضعه في أعلى النموذج
        const form = document.querySelector('.form-section') || document.getElementById('loginForm');
        form.insertBefore(messagesDiv, form.firstChild);
      }
      
      messagesDiv.textContent = message;
      messagesDiv.style.color = type === 'error' ? '#e74c3c' : '#27ae60';
      
      // إزالة الرسالة بعد فترة
      setTimeout(() => {
        if (messagesDiv.parentElement) {
          messagesDiv.parentElement.removeChild(messagesDiv);
        }
      }, 5000);
    }

    // إغلاق النافذة عند النقر على "x"
    document.querySelector('.close')?.addEventListener('click', closeUpdateModal);

    // إغلاق النافذة عند النقر خارج المحتوى
    window.onclick = function(event) {
      const modal = document.getElementById('updateModal');
      if (event.target === modal) {
        closeUpdateModal();
      }
    };
  </script>
</body>
</html>
