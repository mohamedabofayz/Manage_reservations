<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تحديث أسعار الفنادق</title>
<style>
  body { font-family: Tahoma, sans-serif; direction: rtl; padding: 20px; background: #f9f9f9; }
  .logo { width: 200px; margin-bottom: 20px; }
  label { display: block; margin-top: 10px; font-weight: bold; }
  select, input { width: 200px; padding: 5px; margin-top: 5px; }
  .hotel-info, .update-fields { margin-top: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
  .hotel-info h3, .update-fields h3 { margin-top: 0; }
  button { margin-top: 15px; padding: 10px 20px; background: #007bff; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
  button:hover { background: #0056b3; }
</style>
</head>
<body>

<img src="https://iroom.ai/web/image/website/1/logo/iroom?unique=89c76a1" class="logo">

<h2>تحديث أسعار الفنادق</h2>

<label for="hotelSelect">اختر الفندق:</label>
<select id="hotelSelect">
  <option value="">-- اختر الفندق --</option>
</select>

<div class="hotel-info" id="hotelInfo" style="display:none;">
  <h3>الموجود حالياً:</h3>
  <p>جوال: <span id="currentPhone"></span></p>
  <p>البريد: <span id="currentEmail"></span></p>
  <p>من تاريخ: <span id="currentFrom"></span></p>
  <p>إلى تاريخ: <span id="currentTo"></span></p>
  <p>مفردة: <span id="currentSingle"></span></p>
  <p>مزدوجة: <span id="currentDouble"></span></p>
  <p>ثلاثية: <span id="currentTriple"></span></p>
  <p>رباعية: <span id="currentQuad"></span></p>
  <p>خماسية: <span id="currentQuint"></span></p>
</div>

<div class="update-fields" id="updateFields" style="display:none;">
  <h3>أدخل الأسعار الجديدة:</h3>
  <label>مفردة: <input type="number" id="newSingle"></label>
  <label>مزدوجة: <input type="number" id="newDouble"></label>
  <label>ثلاثية: <input type="number" id="newTriple"></label>
  <label>رباعية: <input type="number" id="newQuad"></label>
  <label>خماسية: <input type="number" id="newQuint"></label>
  <button onclick="updateHotel()">تحديث الأسعار</button>
</div>

<script>
let hotelsData = [];

async function fetchHotels() {
  const response = await fetch('https://script.google.com/macros/s/AKfycby1b2X0ST9ehMp0BQtOyteSBycZP2Y0P5bRUXhnLCNKuQcAiSRpyjPO1xfK0R0teCKq/exec'); // ضع هنا رابط الـ Web App
  hotelsData = await response.json();
  const select = document.getElementById('hotelSelect');
  hotelsData.forEach((hotel, index) => {
    const option = document.createElement('option');
    option.value = index;
    option.textContent = hotel.name;
    select.appendChild(option);
  });
}

function showHotelInfo(index) {
  if(index === "") {
    document.getElementById('hotelInfo').style.display = 'none';
    document.getElementById('updateFields').style.display = 'none';
    return;
  }
  const hotel = hotelsData[index];
  document.getElementById('currentPhone').textContent = hotel.phone;
  document.getElementById('currentEmail').textContent = hotel.email;
  document.getElementById('currentFrom').textContent = hotel.fromDate;
  document.getElementById('currentTo').textContent = hotel.toDate;
  document.getElementById('currentSingle').textContent = hotel.single;
  document.getElementById('currentDouble').textContent = hotel.double;
  document.getElementById('currentTriple').textContent = hotel.triple;
  document.getElementById('currentQuad').textContent = hotel.quadruple;
  document.getElementById('currentQuint').textContent = hotel.quintuple;

  document.getElementById('hotelInfo').style.display = 'block';
  document.getElementById('updateFields').style.display = 'block';
}

function updateHotel() {
  const index = document.getElementById('hotelSelect').value;
  if(index === "") return alert("اختر الفندق أولاً!");
  
  const hotel = hotelsData[index];
  hotel.single = document.getElementById('newSingle').value || hotel.single;
  hotel.double = document.getElementById('newDouble').value || hotel.double;
  hotel.triple = document.getElementById('newTriple').value || hotel.triple;
  hotel.quadruple = document.getElementById('newQuad').value || hotel.quadruple;
  hotel.quintuple = document.getElementById('newQuint').value || hotel.quintuple;

  alert(`تم تحديث الأسعار للفندق: ${hotel.name}\nمفردة: ${hotel.single}, مزدوجة: ${hotel.double}, ثلاثية: ${hotel.triple}, رباعية: ${hotel.quadruple}, خماسية: ${hotel.quintuple}`);
  // هنا يمكن إضافة fetch POST لإرسال البيانات مرة أخرى للـ Google Sheet
}

document.getElementById('hotelSelect').addEventListener('change', (e) => showHotelInfo(e.target.value));

fetchHotels();
</script>

</body>
</html>
