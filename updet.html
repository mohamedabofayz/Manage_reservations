<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تحديث أسعار الفنادق</title>
<style>
  body { font-family: Tahoma, sans-serif; direction: rtl; background: #f4f4f4; margin: 0; padding: 20px; }
  .container { max-width: 800px; margin: auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
  .logo { display: block; margin: 0 auto 20px auto; width: 180px; }
  h2 { text-align: center; margin-bottom: 25px; }
  label { display: block; margin-bottom: 5px; font-weight: bold; }
  select, input { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; }
  .section { margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px; }
  .section h3 { margin-top: 0; }
  .btn { display: inline-block; padding: 10px 20px; background: #007bff; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
  .btn:hover { background: #0056b3; }
  p { margin: 5px 0; }
</style>
</head>
<body>

<div class="container">
  <img src="https://iroom.ai/web/image/website/1/logo/iroom?unique=89c76a1" class="logo">
  <h2>تحديث أسعار الفنادق</h2>

  <label for="hotelSelect">اختر الفندق:</label>
  <select id="hotelSelect">
    <option value="">-- اختر الفندق --</option>
  </select>

  <div class="section" id="hotelInfo" style="display:none;">
    <h3>المعلومات الحالية:</h3>
    <div class="grid">
      <p><strong>جوال:</strong> <span id="currentPhone"></span></p>
      <p><strong>البريد:</strong> <span id="currentEmail"></span></p>
      <p><strong>من تاريخ:</strong> <span id="currentFrom"></span></p>
      <p><strong>إلى تاريخ:</strong> <span id="currentTo"></span></p>
      <p><strong>مفردة:</strong> <span id="currentSingle"></span></p>
      <p><strong>مزدوجة:</strong> <span id="currentDouble"></span></p>
      <p><strong>ثلاثية:</strong> <span id="currentTriple"></span></p>
      <p><strong>رباعية:</strong> <span id="currentQuad"></span></p>
      <p><strong>خماسية:</strong> <span id="currentQuint"></span></p>
    </div>
  </div>

  <div class="section" id="updateFields" style="display:none;">
    <h3>أدخل الأسعار والفترة الجديدة:</h3>
    <div class="grid">
      <label>من تاريخ: <input type="date" id="newFrom"></label>
      <label>إلى تاريخ: <input type="date" id="newTo"></label>
      <label>مفردة: <input type="number" id="newSingle"></label>
      <label>مزدوجة: <input type="number" id="newDouble"></label>
      <label>ثلاثية: <input type="number" id="newTriple"></label>
      <label>رباعية: <input type="number" id="newQuad"></label>
      <label>خماسية: <input type="number" id="newQuint"></label>
    </div>
    <button class="btn" onclick="updateHotel()">تحديث الأسعار</button>
  </div>
</div>

<script>
let hotelsData = [];

async function fetchHotels() {
  const response = await fetch('https://script.google.com/macros/s/AKfycby1b2X0ST9ehMp0BQtOyteSBycZP2Y0P5bRUXhnLCNKuQcAiSRpyjPO1xfK0R0teCKq/exec'); // ضع هنا رابط Web App
  hotelsData = await response.json();
  const select = document.getElementById('hotelSelect');
  hotelsData.forEach((hotel, index) => {
    const option = document.createElement('option');
    option.value = index;
    option.textContent = hotel.name;
    select.appendChild(option);
  });
}

function showHotelInfo(index) {
  if(index === "") {
    document.getElementById('hotelInfo').style.display = 'none';
    document.getElementById('updateFields').style.display = 'none';
    return;
  }
  const hotel = hotelsData[index];
  document.getElementById('currentPhone').textContent = hotel.phone;
  document.getElementById('currentEmail').textContent = hotel.email;
  document.getElementById('currentFrom').textContent = hotel.fromDate;
  document.getElementById('currentTo').textContent = hotel.toDate;
  document.getElementById('currentSingle').textContent = hotel.single;
  document.getElementById('currentDouble').textContent = hotel.double;
  document.getElementById('currentTriple').textContent = hotel.triple;
  document.getElementById('currentQuad').textContent = hotel.quadruple;
  document.getElementById('currentQuint').textContent = hotel.quintuple;

  document.getElementById('updateFields').style.display = 'block';
  document.getElementById('hotelInfo').style.display = 'block';

  // قيم افتراضية للحقول الجديدة
  document.getElementById('newFrom').value = hotel.fromDate ? formatDateInput(hotel.fromDate) : '';
  document.getElementById('newTo').value = hotel.toDate ? formatDateInput(hotel.toDate) : '';
  document.getElementById('newSingle').value = hotel.single;
  document.getElementById('newDouble').value = hotel.double;
  document.getElementById('newTriple').value = hotel.triple;
  document.getElementById('newQuad').value = hotel.quadruple;
  document.getElementById('newQuint').value = hotel.quintuple;
}

function formatDateInput(dateStr) {
  const d = new Date(dateStr);
  if(isNaN(d)) return '';
  const month = ('0'+(d.getMonth()+1)).slice(-2);
  const day = ('0'+d.getDate()).slice(-2);
  return `${d.getFullYear()}-${month}-${day}`;
}

async function updateHotel() {
  const index = document.getElementById('hotelSelect').value;
  if(index === "") return alert("اختر الفندق أولاً!");

  const hotel = hotelsData[index];
  const payload = {
    name: hotel.name,
    fromDate: document.getElementById('newFrom').value,
    toDate: document.getElementById('newTo').value,
    single: document.getElementById('newSingle').value,
    double: document.getElementById('newDouble').value,
    triple: document.getElementById('newTriple').value,
    quadruple: document.getElementById('newQuad').value,
    quintuple: document.getElementById('newQuint').value
  };

  try {
    const response = await fetch('https://script.google.com/macros/s/AKfycby1b2X0ST9ehMp0BQtOyteSBycZP2Y0P5bRUXhnLCNKuQcAiSRpyjPO1xfK0R0teCKq/exec', {
      method: 'POST',
      body: JSON.stringify(payload),
      headers: {'Content-Type': 'application/json'}
    });
    const result = await response.json();
    if(result.status === "success") {
      alert(result.message);
      showHotelInfo(index); // تحديث المعاينة بعد التعديل
    } else {
      alert("خطأ: " + result.message);
    }
  } catch(err) {
    alert("حدث خطأ أثناء إرسال البيانات: " + err.message);
  }
}

document.getElementById('hotelSelect').addEventListener('change', (e) => showHotelInfo(e.target.value));

fetchHotels();
</script>

</body>
</html>
