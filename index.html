<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>نموذج طلب حجز</title>

<style>
body { font-family: "Tajawal", sans-serif; background: #f7f7f7; padding: 20px; }
.container { max-width: 900px; margin: auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
h2 { text-align: center; margin-bottom: 20px; }
.row { display: flex; gap: 10px; margin-bottom: 12px; }
.row input, .row select { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
.group-title { font-weight: bold; margin-top: 25px; background: #eee; padding: 8px; border-radius: 6px; }
button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #007bff; color: white; font-size: 17px; cursor: pointer; margin-top: 20px; }
button:hover { background: #005fcc; }
img.logo { width: 180px; display: block; margin: 10px auto 20px auto; }
#addGuestBtn { background: #28a745; margin-top: 5px; }
</style>

</head>
<body>

<div class="container">

<img class="logo" src="https://iroom.ai/web/image/website/1/logo/iroom?unique=89c76a1">

<h2>نموذج طلب حجز</h2>

<form id="bookingForm">

<div class="row">
    <input type="text" name="invoice" id="invoiceNumber" placeholder="رقم الفاتورة" required>
    <input type="text" name="clientName" placeholder="إسم العميل" required>
</div>

<div class="row">
    <input type="text" name="clientPhone" placeholder="رقم الجوال" required>
    <input type="text" name="address" placeholder="العنوان">
</div>

<div class="row">
    <input type="email" name="clientEmail" placeholder="البريد الالكتروني">
</div>

<div class="row">
    <select name="hotelName" id="hotelSelect" required>
        <option value="">— تحميل الفنادق… —</option>
    </select>
</div>

<div class="row">
    <input type="text" name="hotelPhone" placeholder="جوال الفندق">
    <input type="email" name="hotelEmail" placeholder="البريد الفندق">
</div>

<div class="row">
    <input type="text" name="todayDate" id="todayField" placeholder="تاريخ اليوم">
    <input type="text" name="reservationNumber" placeholder="رقم الحجز">
</div>

<div id="guestContainer"></div>

<button id="addGuestBtn" type="button">+ إضافة ضيف</button>

<div class="row">
    <input type="text" name="total" id="totalField" placeholder="الإجمالي" readonly>
</div>

<button type="submit">إرسال الطلب</button>
</form>
</div>

<script>

// رقم الفاتورة تلقائي
function generateInvoiceNumber() {
    const now = new Date();
    return `IR-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${Math.floor(1000+Math.random()*9000)}`;
}
document.getElementById("invoiceNumber").value = generateInvoiceNumber();

// تاريخ اليوم
document.getElementById("todayField").value = new Date().toISOString().slice(0,10).split("-").reverse().join("-");

// بيانات الفنادق
let guestCount = 0;
let hotelData = [];
const HOTELS_API = "https://script.google.com/macros/s/AKfycby1b2X0ST9ehMp0BQtOyteSBycZP2Y0P5bRUXhnLCNKuQcAiSRpyjPO1xfK0R0teCKq/exec";

// تحميل الفنادق
async function loadHotels() {
    const res = await fetch(HOTELS_API);
    hotelData = await res.json();
    const hotelSelect = document.getElementById("hotelSelect");
    hotelSelect.innerHTML = "<option value=''>— اختر الفندق —</option>";
    hotelData.forEach(h => {
        hotelSelect.innerHTML += `<option value="${h.name}">${h.name} — ${h.fromDate} إلى ${h.toDate}</option>`;
    });
}
loadHotels();

// عند اختيار فندق
document.getElementById("hotelSelect").addEventListener("change", (e) => {
    const selected = hotelData.find(h => h.name === e.target.value);
    if (selected) {
        document.querySelector("input[name='hotelPhone']").value = selected.phone;
        document.querySelector("input[name='hotelEmail']").value = selected.email;
        for (let i=1;i<=guestCount;i++) calcPrice(i);
    }
});

// إضافة ضيف
function addGuest() {
    if (guestCount >= 4) return alert("وصلت للحد الأقصى (4 ضيوف)");
    guestCount++;

    const box = document.createElement("div");
    box.innerHTML = `
        <div class="group-title">بيانات الضيف ${guestCount}</div>

        <div class="row">
            <input name="name${guestCount}" placeholder="اسم الضيف">
            <input type="date" id="arrive${guestCount}" name="checkin${guestCount}">
        </div>

        <div class="row">
            <input type="date" id="leave${guestCount}" name="checkout${guestCount}">
            <input id="nights${guestCount}" name="nights${guestCount}" placeholder="ليلي" readonly>
        </div>

        <div class="row">
            <select id="type${guestCount}" name="type${guestCount}">
                <option value="">— اختر النوع —</option>
                <option value="مفردة">مفردة</option>
                <option value="مزدوجة">مزدوجة</option>
                <option value="ثلاثية">ثلاثية</option>
                <option value="رباعية">رباعية</option>
                <option value="خماسية">خماسية</option>
            </select>

            <input type="number" min="1" value="1" id="rooms${guestCount}" name="rooms${guestCount}" placeholder="عدد الغرف">
        </div>

        <div class="row">
            <input id="amount${guestCount}" name="amount${guestCount}" placeholder="المبلغ" readonly>
        </div>
    `;
    document.getElementById("guestContainer").appendChild(box);

    attachPriceCalc(guestCount);
    calcPrice(guestCount);
}

document.getElementById("addGuestBtn").addEventListener("click", addGuest);

// حساب الليالي
function calcNights(i) {
    const a = document.getElementById(`arrive${i}`).value;
    const l = document.getElementById(`leave${i}`).value;
    if (!a || !l) return 0;
    const diff = (new Date(l) - new Date(a)) / (1000 * 60 * 60 * 24);
    return diff > 0 ? diff : 0;
}

// حساب السعر
function calcPrice(i) {
    const hotelName = document.getElementById("hotelSelect").value;
    const type = document.getElementById(`type${i}`).value;
    const checkin = document.getElementById(`arrive${i}`).value;
    const checkout = document.getElementById(`leave${i}`).value;
    const rooms = parseInt(document.getElementById(`rooms${i}`).value || 1);

    if (!hotelName || !type || !checkin || !checkout) return;

    const hotel = hotelData.find(h => h.name === hotelName);

    // التحقق من الفترة
    if (checkin < hotel.fromDate || checkout > hotel.toDate) {
        document.getElementById(`amount${i}`).value = "";
        document.getElementById(`nights${i}`).value = "0";
        calcTotal();
        return;
    }

    const nights = calcNights(i);
    document.getElementById(`nights${i}`).value = `${nights} ليلة × ${rooms} غرفة`;

    let pricePerNight = 0;
    switch(type){
        case 'مفردة': pricePerNight = hotel.single; break;
        case 'مزدوجة': pricePerNight = hotel.double; break;
        case 'ثلاثية': pricePerNight = hotel.triple; break;
        case 'رباعية': pricePerNight = hotel.quadruple; break;
        case 'خماسية': pricePerNight = hotel.quintuple; break;
    }

    document.getElementById(`amount${i}`).value = (pricePerNight * nights * rooms).toFixed(2);

    calcTotal();
}

// ربط الأحداث
function attachPriceCalc(i){
    ["arrive", "leave", "type", "rooms"].forEach(field => {
        document.getElementById(`${field}${i}`).addEventListener("change", () => calcPrice(i));
    });
}

// حساب الإجمالي
function calcTotal() {
    let sum = 0;
    for (let i=1;i<=guestCount;i++){
        sum += parseFloat(document.getElementById(`amount${i}`)?.value || 0);
    }
    document.getElementById("totalField").value = sum.toFixed(2);
}

// إرسال البيانات
document.getElementById("bookingForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    await fetch(HOTELS_API, { method: "POST", body: JSON.stringify(data) });
    alert("تم إرسال الطلب بنجاح 🎉");
    e.target.reset();
    guestCount = 0;
    document.getElementById("guestContainer").innerHTML = "";
    document.getElementById("totalField").value = "";
    addGuest();
});

// إضافة الضيف الأول
addGuest();

</script>

</body>
</html>
