<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>نموذج طلب حجز</title>
<style>
    body {
        font-family: "Tajawal", sans-serif;
        background: #f7f7f7;
        padding: 20px;
    }
    .container {
        max-width: 900px;
        margin: auto;
        background: #fff;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    h2 {
        text-align: center;
        margin-bottom: 20px;
    }
    .row {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
    }
    .row input, .row select {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
    }
    .group-title {
        font-weight: bold;
        margin-top: 25px;
        background: #eee;
        padding: 8px;
        border-radius: 6px;
    }
    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #007bff;
        color: white;
        font-size: 17px;
        cursor: pointer;
        margin-top: 20px;
    }
    button:hover {
        background: #005fcc;
    }
    img.logo {
        width: 180px;
        display: block;
        margin: 10px auto 20px auto;
    }
</style>
</head>
<body>

<div class="container">

<img class="logo" src="https://iroom.ai/web/image/website/1/logo/iroom?unique=89c76a1">

<h2>نموذج طلب حجز</h2>

<form id="bookingForm">

<!-- بيانات أساسية -->
<div class="row">
    <input type="text" name="رقم الفاتورة" placeholder="رقم الفاتورة" required>
    <input type="text" name="إسم العميل" placeholder="إسم العميل" required>
</div>

<div class="row">
    <input type="text" name="رقم الجوال" placeholder="رقم الجوال" required>
    <input type="text" name="العنوان" placeholder="العنوان">
</div>

<div class="row">
    <input type="email" name="البريد الالكتروني" placeholder="البريد الالكتروني">
</div>

<!-- فندق -->
<div class="row">
    <select name="اسم الفندق" id="hotelSelect" required>
        <option value="">— تحميل الفنادق… —</option>
    </select>
</div>

<div class="row">
    <input type="text" name="جوال الفندق" placeholder="جوال الفندق">
    <input type="email" name="البريد الفندق" placeholder="البريد الفندق">
</div>

<div class="row">
    <input type="text" name="تاريخ اليوم" placeholder="تاريخ اليوم" value="">
    <input type="text" name="رقم الحجز" placeholder="رقم الحجز">
</div>

<!-- المجموعات -->
<script>
function guestBlock(i){
return `
<div class="group-title">بيانات الضيف ${i}</div>
<div class="row">
    <input name="اسم ${i}" placeholder="اسم ${i}">
    <input name="وصول ${i}" placeholder="وصول ${i}">
</div>
<div class="row">
    <input name="مغادرة ${i}" placeholder="مغادرة ${i}">
    <input name="ليلي ${i}" placeholder="ليلي ${i}">
</div>
<div class="row">
    <input name="نوع ${i}" placeholder="نوع ${i}">
    <input name="مبلغ ${i}" placeholder="مبلغ ${i}">
</div>
`;
}
document.write(guestBlock(1));
document.write(guestBlock(2));
document.write(guestBlock(3));
document.write(guestBlock(4));
</script>

<div class="row">
    <input type="text" name="الإجمالي" placeholder="الإجمالي">
</div>

<button type="submit">إرسال الطلب</button>

</form>

</div>

<script>
// 🔹 رابط Web App الذي يرجع قائمة الفنادق
const HOTELS_API = "ضع_رابط_WebApp_هنا";

async function loadHotels() {
    try {
        let res = await fetch(HOTELS_API);
        let hotels = await res.json();

        let hotelSelect = document.getElementById("hotelSelect");
        hotelSelect.innerHTML = "<option value=''>— اختر الفندق —</option>";

        hotels.forEach(h => {
            hotelSelect.innerHTML += `<option value="${h}">${h}</option>`;
        });

    } catch (e) {
        alert("تعذر تحميل قائمة الفنادق — تأكد من رابط Web App");
    }
}

loadHotels();


// 🔹 إرسال البيانات إلى Google Sheets
document.getElementById("bookingForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = Object.fromEntries(new FormData(e.target).entries());

    await fetch("ضع_رابط_WebApp_للتسجيل_في_الشيت", {
        method: "POST",
        body: JSON.stringify(data)
    });

    alert("تم إرسال الطلب بنجاح! 🎉");
    e.target.reset();
});
</script>

</body>
</html>
