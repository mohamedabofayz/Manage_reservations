<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>نموذج طلب حجز</title>
<style>
    body {
        font-family: "Tajawal", sans-serif;
        background: #f7f7f7;
        padding: 20px;
    }
    .container {
        max-width: 900px;
        margin: auto;
        background: #fff;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    h2 {
        text-align: center;
        margin-bottom: 20px;
    }
    .row {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
    }
    .row input, .row select {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
    }
    .group-title {
        font-weight: bold;
        margin-top: 25px;
        background: #eee;
        padding: 8px;
        border-radius: 6px;
    }
    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #007bff;
        color: white;
        font-size: 17px;
        cursor: pointer;
        margin-top: 20px;
    }
    button:hover {
        background: #005fcc;
    }
    img.logo {
        width: 180px;
        display: block;
        margin: 10px auto 20px auto;
    }
</style>
</head>
<body>

<div class="container">

<img class="logo" src="https://iroom.ai/web/image/website/1/logo/iroom?unique=89c76a1">

<h2>نموذج طلب حجز</h2>

<form id="bookingForm">

<!-- بيانات أساسية -->
<div class="row">
    <input type="text" name="رقم الفاتورة" id="invoiceId" placeholder="رقم الفاتورة" required readonly>
    <input type="text" name="إسم العميل" placeholder="إسم العميل" required>
</div>

<div class="row">
    <input type="text" name="رقم الجوال" placeholder="رقم الجوال" required>
    <input type="text" name="العنوان" placeholder="العنوان">
</div>

<div class="row">
    <input type="email" name="البريد الالكتروني" placeholder="البريد الالكتروني">
</div>

<!-- فندق -->
<div class="row">
    <select name="اسم الفندق" id="hotelSelect" required>
        <option value="">— تحميل الفنادق… —</option>
    </select>
</div>

<div class="row">
    <input type="text" name="جوال الفندق" placeholder="جوال الفندق">
    <input type="email" name="البريد الفندق" placeholder="البريد الفندق">
</div>

<div class="row">
    <input type="text" name="تاريخ اليوم" id="todayField" placeholder="تاريخ اليوم">
    <input type="text" name="رقم الحجز" placeholder="رقم الحجز">
</div>

<!-- ضيوف -->
<script>
function guestBlock(i){
return `
<div class="group-title">بيانات الضيف ${i}</div>
<div class="row">
    <input name="اسم ${i}" placeholder="اسم ${i}">
    <input name="وصول ${i}" placeholder="وصول ${i}">
</div>
<div class="row">
    <input name="مغادرة ${i}" placeholder="مغادرة ${i}">
    <input name="ليلي ${i}" placeholder="ليلي ${i}">
</div>
<div class="row">
    <input name="نوع ${i}" placeholder="نوع ${i}">
    <input class="amount-field" name="مبلغ ${i}" data-index="${i}" placeholder="مبلغ ${i}">
</div>
`;
}
document.write(guestBlock(1));
document.write(guestBlock(2));
document.write(guestBlock(3));
document.write(guestBlock(4));
</script>

<div class="row">
    <input type="text" name="الإجمالي" id="totalField" placeholder="الإجمالي" readonly>
</div>

<button type="submit">إرسال الطلب</button>

</form>

</div>

<script>
// -------------------------------------------------------------
// 1) رقم الفاتورة تلقائي
// -------------------------------------------------------------
function generateInvoiceNumber() {
    const today = new Date();
    const y = today.getFullYear();
    const m = String(today.getMonth() + 1).padStart(2, "0");
    const d = String(today.getDate()).padStart(2, "0");
    const randomPart = Math.floor(1000 + Math.random() * 9000);

    return `IR-${y}${m}${d}-${randomPart}`;
}

// -------------------------------------------------------------
// 2) التاريخ تلقائي — تنسيق يوم-شهر-سنة
// -------------------------------------------------------------
function setTodayDate() {
    const now = new Date();
    const day = String(now.getDate()).padStart(2, "0");
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const year = now.getFullYear();
    document.getElementById("todayField").value = `${day}-${month}-${year}`;
}

// -------------------------------------------------------------
// 3) حساب الإجمالي تلقائي من مبالغ 1 إلى 4
// -------------------------------------------------------------
function calculateTotal() {
    let total = 0;

    document.querySelectorAll(".amount-field").forEach(field => {
        const val = parseFloat(field.value) || 0;
        total += val;
    });

    document.getElementById("totalField").value = total.toFixed(2);
}

// تفعيل التحديث الفوري عند تغيير المبالغ
document.addEventListener("input", (e) => {
    if (e.target.classList.contains("amount-field")) {
        calculateTotal();
    }
});

// -------------------------------------------------------------
// 4) تحميل القائمة التلقائية للفنادق
// -------------------------------------------------------------
const HOTELS_API = "https://script.google.com/macros/s/AKfycby1b2X0ST9ehMp0BQtOyteSBycZP2Y0P5bRUXhnLCNKuQcAiSRpyjPO1xfK0R0teCKq/exec";

async function loadHotels() {
    try {
        let res = await fetch(HOTELS_API);
        let hotels = await res.json();

        let hotelSelect = document.getElementById("hotelSelect");
        hotelSelect.innerHTML = "<option value=''>— اختر الفندق —</option>";

        hotels.forEach(h => {
            hotelSelect.innerHTML += `<option value="${h}">${h}</option>`;
        });

    } catch (e) {
        alert("تعذر تحميل قائمة الفنادق — تأكد من الرابط");
    }
}

// -------------------------------------------------------------
// 5) تهيئة الصفحة عند التحميل
// -------------------------------------------------------------
document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("invoiceId").value = generateInvoiceNumber();
    setTodayDate();
    loadHotels();
});


// -------------------------------------------------------------
// 6) إرسال البيانات إلى Google Sheets
// -------------------------------------------------------------
document.getElementById("bookingForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = Object.fromEntries(new FormData(e.target).entries());

    await fetch("https://script.google.com/macros/s/AKfycby1b2X0ST9ehMp0BQtOyteSBycZP2Y0P5bRUXhnLCNKuQcAiSRpyjPO1xfK0R0teCKq/exec", {
        method: "POST",
        body: JSON.stringify(data)
    });

    alert("تم إرسال الطلب بنجاح! 🎉");
    e.target.reset();

    // إعادة توليد رقم فاتورة جديد بعد الإرسال
    document.getElementById("invoiceId").value = generateInvoiceNumber();
    setTodayDate();
});
</script>

</body>
</html>
