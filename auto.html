<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>نموذج طلب حجز (يدوي)</title>

<style>
body { font-family: "Tajawal", sans-serif; background: #f7f7f7; padding: 20px; color: #333; }
.container { max-width: 900px; margin: auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
h2 { text-align: center; margin-bottom: 20px; }
.row { display: flex; gap: 10px; margin-bottom: 12px; }
.row input, .row select { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
.group-title { font-weight: bold; margin-top: 25px; background: #f1f3f5; padding: 10px; border-radius: 6px; border-right: 4px solid #007bff; }
button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #007bff; color: white; font-size: 17px; cursor: pointer; }
button:disabled { background: #ccc; cursor: not-allowed; }
img.logo { width: 180px; display: block; margin: auto; }
#addGuestBtn { background: #28a745; width: auto; padding: 10px 30px; margin: 10px auto; }
#totalField { background: #e9ecef; font-weight: bold; text-align: center; }

/* ====== صندوق الرسائل ====== */
#statusBox {
    display:none;
    margin: 15px 0;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    text-align: center;
}
.status-loading { background:#fff3cd; color:#856404; }
.status-success { background:#d4edda; color:#155724; }
.status-error { background:#f8d7da; color:#721c24; }

.invoices-section { margin-top: 40px; border-top: 2px dashed #ddd; padding-top: 20px; }
.invoice-card { background:#fdfdfd; border:1px solid #e0e0e0; padding:15px; border-radius:8px; display:flex; justify-content:space-between; margin-bottom:10px; }
.invoice-link { background:#dc3545; color:white; padding:8px 15px; border-radius:5px; text-decoration:none; }

@media (max-width:600px){ .row{flex-direction:column;} }
</style>
</head>

<body>

<div class="container">
<img class="logo" src="https://iroom.ai/web/image/website/1/logo/iroom?unique=89c76a1">

<h2>نموذج طلب حجز (يدوي)</h2>

<!-- 🔔 صندوق الحالة -->
<div id="statusBox"></div>

<form id="bookingForm">
<div class="row">
<input id="invoiceNumber" name="invoice" placeholder="رقم الفاتورة" required>
<input name="clientName" placeholder="اسم العميل" required>
</div>

<div class="row">
<input name="clientPhone" placeholder="رقم الجوال" required>
<input name="address" placeholder="العنوان">
</div>

<div class="row">
<input name="clientEmail" type="email" placeholder="البريد الإلكتروني">
</div>

<hr>

<div class="row">
<input id="hotelName" name="hotelName" placeholder="اسم الفندق" required>
</div>

<div class="row">
<input name="hotelPhone" placeholder="جوال الفندق">
<input name="hotelEmail" type="email" placeholder="بريد الفندق">
</div>

<div class="row">
<input id="todayField" name="todayDate">
<input name="reservationNumber" placeholder="رقم الحجز">
</div>

<div id="guestContainer"></div>

<button id="addGuestBtn" type="button">+ إضافة ضيف</button>

<div class="row">
<input id="totalField" name="total" readonly placeholder="0.00">
</div>

<button id="submitBtn">إرسال الطلب وإنشاء الفاتورة</button>
</form>

<div class="invoices-section">
<h3>📂 فواتير اليوم</h3>
<div id="invoicesList">جاري التحميل...</div>
</div>

</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-7slEGPs_YuBUAgX_Mi-1XlCGninicp2_hSBXQC-zg32qgypq7gsrIZkVFzr5X0-a/exec";

const statusBox = document.getElementById("statusBox");

function showStatus(type, msg){
    statusBox.className = "";
    statusBox.classList.add(type);
    statusBox.innerText = msg;
    statusBox.style.display = "block";
}

function generateInvoiceNumber(){
    const d = new Date();
    return `IR-${d.getFullYear()}${(d.getMonth()+1+"").padStart(2,0)}${(d.getDate()+"").padStart(2,0)}-${Math.floor(1000+Math.random()*9000)}`;
}

invoiceNumber.value = generateInvoiceNumber();
todayField.value = new Date().toLocaleDateString("ar-SA");

let guestCount = 0;

function addGuest(){
    guestCount++;
    guestContainer.innerHTML += `
    <div class="group-title">ضيف ${guestCount}</div>
    <div class="row">
    <input name="name${guestCount}" placeholder="اسم الضيف">
    <input type="number" step="0.01" class="amount" placeholder="السعر" oninput="calcTotal()">
    </div>`;
}
addGuestBtn.onclick = addGuest;
addGuest();

function calcTotal(){
    let sum=0;
    document.querySelectorAll(".amount").forEach(e=>sum+=+e.value||0);
    totalField.value = sum.toFixed(2);
}

bookingForm.onsubmit = async e=>{
e.preventDefault();
submitBtn.disabled=true;
showStatus("status-loading","⏳ جاري حفظ الطلب وإنشاء الفاتورة...");

try{
    const data = Object.fromEntries(new FormData(e.target));
    const res = await fetch(GOOGLE_SCRIPT_URL,{method:"POST",body:JSON.stringify(data)});
    const r = await res.json();

    if(r.status==="success"){
        showStatus("status-success","✅ تم إنشاء الفاتورة بنجاح");
        bookingForm.reset();
        guestContainer.innerHTML="";
        guestCount=0; addGuest();
        invoiceNumber.value = generateInvoiceNumber();
        fetchInvoices();
    }else{
        showStatus("status-error","❌ خطأ من السيرفر: "+r.message);
    }
}catch{
    showStatus("status-error","❌ فشل الاتصال بالإنترنت");
}
submitBtn.disabled=false;
};

async function fetchInvoices(){
    const box=invoicesList;
    box.innerHTML="⏳ جاري التحديث...";
    try{
        const r=await fetch(GOOGLE_SCRIPT_URL);
        const d=await r.json();
        box.innerHTML="";
        if(!d.length){ box.innerHTML="لا توجد فواتير اليوم"; return; }
        d.reverse().forEach(i=>{
            box.innerHTML+=`
            <div class="invoice-card">
            <div>${i.name}<br><small>${i.date}</small></div>
            <a class="invoice-link" href="${i.link}" target="_blank">PDF</a>
            </div>`;
        });
    }catch{
        box.innerHTML="❌ فشل تحميل الفواتير";
    }
}
fetchInvoices();
</script>

</body>
</html>
