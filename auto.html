<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>نموذج طلب حجز (يدوي)</title>

<style>
body { font-family: "Tajawal", sans-serif; background: #f7f7f7; padding: 20px; }
.container { max-width: 900px; margin: auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
h2 { text-align: center; margin-bottom: 20px; }
.row { display: flex; gap: 10px; margin-bottom: 12px; }
.row input, .row select { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
.group-title { font-weight: bold; margin-top: 25px; background: #eee; padding: 8px; border-radius: 6px; }
button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #007bff; color: white; font-size: 17px; cursor: pointer; margin-top: 20px; }
button:hover { background: #005fcc; }
#addGuestBtn { background: #28a745; }
#totalField { background-color: #e9ecef; font-weight: bold; }
</style>
</head>

<body>
<div class="container">
<h2>نموذج طلب حجز (يدوي)</h2>

<form id="bookingForm">

<div class="row">
  <input id="invoiceNumber" name="invoice" placeholder="رقم الفاتورة">
  <input name="clientName" placeholder="اسم العميل">
</div>

<div class="row">
  <input name="clientPhone" placeholder="رقم الجوال">
  <input name="address" placeholder="العنوان">
</div>

<div class="row">
  <input name="clientEmail" placeholder="البريد الإلكتروني">
</div>

<hr>

<div class="row">
  <input name="hotelName" placeholder="اسم الفندق">
</div>

<div class="row">
  <input name="hotelPhone" placeholder="جوال الفندق">
  <input name="hotelEmail" placeholder="بريد الفندق">
</div>

<div class="row">
  <input id="todayField" name="todayDate">
  <input name="reservationNumber" placeholder="رقم الحجز">
</div>

<div id="guestContainer"></div>

<button type="button" id="addGuestBtn">+ إضافة ضيف</button>

<div class="row">
  <input id="totalField" name="total" readonly placeholder="الإجمالي">
</div>

<button type="submit">إرسال</button>
</form>
</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-7slEGPs_YuBUAgX_Mi-1XlCGninicp2_hSBXQC-zg32qgypq7gsrIZkVFzr5X0-a/exec";

document.getElementById("invoiceNumber").value =
  "IR-" + Date.now();

document.getElementById("todayField").value =
  new Date().toISOString().slice(0,10);

let guestCount = 0;

function addGuest(){
  guestCount++;
  const div = document.createElement("div");
  div.innerHTML = `
    <div class="group-title">الضيف ${guestCount}</div>

    <div class="row">
      <input name="name${guestCount}" placeholder="اسم الضيف">
      <input type="date" name="checkin${guestCount}">
    </div>

    <div class="row">
      <input type="date" name="checkout${guestCount}">
      <input name="nights${guestCount}" placeholder="عدد الليالي">
    </div>

    <div class="row">
      <select name="type${guestCount}">
        <option value="">نوع الغرفة</option>
        <option value="مفردة">مفردة</option>
        <option value="مزدوجة">مزدوجة</option>
        <option value="ثلاثية">ثلاثية</option>
      </select>
      <input name="rooms${guestCount}" type="number" value="1">
    </div>

    <div class="row">
      <input class="amount-field" name="amount${guestCount}" type="number" step="0.01" placeholder="السعر" oninput="calcTotal()">
    </div>
  `;
  document.getElementById("guestContainer").appendChild(div);
}

function calcTotal(){
  let sum = 0;
  document.querySelectorAll(".amount-field").forEach(i=>{
    if(i.value) sum += parseFloat(i.value);
  });
  document.getElementById("totalField").value = sum.toFixed(2);
}

document.getElementById("addGuestBtn").onclick = addGuest;
addGuest();

document.getElementById("bookingForm").onsubmit = async e=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = Object.fromEntries(fd.entries());

  for(let i=1;i<=guestCount;i++){
    if(data[`type${i}`] && data[`rooms${i}`]){
      data[`type${i}`] = `${data[`type${i}`]} × ${data[`rooms${i}`]} غرفة`;
    }
  }

  await fetch(GOOGLE_SCRIPT_URL,{
    method:"POST",
    body: JSON.stringify(data)
  });

  alert("تم الإرسال بنجاح");
  e.target.reset();
};
</script>
</body>
</html>
