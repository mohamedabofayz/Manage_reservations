<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>نموذج طلب حجز</title>

<style>
body { font-family: Tajawal, sans-serif; background:#f7f7f7; padding:20px }
.container { max-width:900px; margin:auto; background:#fff; padding:25px; border-radius:15px }
.row { display:flex; gap:10px; margin-bottom:10px }
.row input,.row select { flex:1; padding:10px; border-radius:8px; border:1px solid #ccc }
.group-title { background:#eee; padding:8px; font-weight:bold; border-radius:6px; margin-top:20px }
button { width:100%; padding:14px; border:none; border-radius:8px; background:#007bff; color:#fff; font-size:17px; cursor:pointer }
button:disabled { background:#999 }
#totalField { background:#e9ecef; font-weight:bold }
</style>
</head>

<body>
<div class="container">
<h2 style="text-align:center">نموذج طلب حجز</h2>

<form id="bookingForm">

<div class="row">
  <input name="invoice" id="invoice" placeholder="رقم الفاتورة">
  <input name="clientName" placeholder="اسم العميل">
</div>

<div class="row">
  <input name="clientPhone" placeholder="رقم الجوال">
  <input name="clientEmail" placeholder="البريد">
</div>

<div id="guestContainer"></div>
<button type="button" onclick="addGuest()">+ إضافة ضيف</button>

<div class="row">
  <input id="totalField" name="total" placeholder="الإجمالي" readonly>
</div>

<button type="submit">إرسال</button>
</form>
</div>

<script>
const GOOGLE_SCRIPT_URL = "ضع_رابط_exec_هنا";

let guestCount = 0;

function generateInvoice(){
  return "IR-" + Date.now();
}
document.getElementById("invoice").value = generateInvoice();

function addGuest(){
  guestCount++;
  const div = document.createElement("div");
  div.innerHTML = `
    <div class="group-title">ضيف ${guestCount}</div>
    <div class="row">
      <input name="name${guestCount}" placeholder="اسم الضيف">
      <select name="type${guestCount}">
        <option value="">نوع الغرفة</option>
        <option value="مفردة">مفردة</option>
        <option value="مزدوجة">مزدوجة</option>
      </select>
    </div>
    <div class="row">
      <input type="number" min="1" value="1" name="rooms${guestCount}" placeholder="عدد الغرف">
      <input type="number" step="0.01" class="amount" name="amount${guestCount}" placeholder="السعر" oninput="calcTotal()">
    </div>
  `;
  document.getElementById("guestContainer").appendChild(div);
}

function calcTotal(){
  let sum = 0;
  document.querySelectorAll(".amount").forEach(i=>{
    const v = parseFloat(i.value);
    if(!isNaN(v)) sum += v;
  });
  document.getElementById("totalField").value = sum.toFixed(2);
}

document.getElementById("bookingForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn = e.target.querySelector("button[type=submit]");
  btn.disabled = true;
  btn.innerText = "جاري الإرسال...";

  const data = Object.fromEntries(new FormData(e.target).entries());

  try{
    const res = await fetch(https://script.google.com/macros/s/AKfycbz-7slEGPs_YuBUAgX_Mi-1XlCGninicp2_hSBXQC-zg32qgypq7gsrIZkVFzr5X0-a/exec,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify(data)
    });

    const text = await res.text();
    const result = JSON.parse(text);

    if(result.status !== "success") throw new Error(result.message);

    document.body.insertAdjacentHTML("beforeend",`
      <div style="margin:20px;padding:15px;background:#e8f5e9;border-radius:10px;text-align:center">
        ✅ تم إنشاء الفاتورة<br>
        <a href="${result.pdfUrl}" target="_blank">🔗 عرض الفاتورة</a>
      </div>
    `);

    e.target.reset();
  }catch(err){
    alert("خطأ:\n" + err.message);
  }finally{
    btn.disabled = false;
    btn.innerText = "إرسال";
  }
});

addGuest();
</script>
</body>
</html>
