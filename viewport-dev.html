<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة التقارير</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<style>
body { background:#f8f9fa; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
#loginDiv { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:100%; max-width:400px; }
#contentDiv { display:none; }
#profitChart { width:100%; height:360px !important; display:block; }
.card { border-radius:12px; box-shadow:0 4px 6px rgba(0,0,0,0.1); margin-bottom:20px; }
.header-bg { background: linear-gradient(135deg,#1e5799 0%,#207cca 51%,#2989d8 100%); color:white; border-radius: 15px 15px 0 0 !important; }
.filter-section { background-color:#e3f2fd; padding:15px; border-radius:10px; margin-bottom:20px; }
.stat-card { transition: transform 0.3s; }
.stat-card:hover { transform: translateY(-5px); }
.badge-status { padding:6px 12px; border-radius:20px; font-size:0.9rem; }
a { cursor:pointer; }
</style>
</head>
<body>

<!-- واجهة تسجيل الدخول -->
<div id="loginDiv" class="card p-4 shadow">
  <h3 class="text-center mb-3">🔒 تسجيل الدخول</h3>
  <input type="password" id="passwordInput" class="form-control mb-3" placeholder="أدخل كلمة المرور">
  <button id="loginBtn" class="btn btn-primary w-100">دخول</button>
  <p id="loginError" class="text-danger mt-2 text-center"></p>
</div>

<!-- المحتوى الرئيسي -->
<div id="contentDiv" class="container-fluid py-4">

  <!-- الهيدر -->
  <div class="row mb-4">
    <div class="col-12">
      <div class="card header-bg text-center">
        <div class="card-body py-4">
          <h1 class="display-5 fw-bold">📊 نظام إدارة التقارير</h1>
          <p class="lead">تقارير المبيعات والأرباح والتحليلات التفاعلية</p>
        </div>
      </div>
    </div>
  </div>

  <!-- الإحصائيات -->
  <div class="row mb-4">
    <div class="col-md-3 col-sm-6 mb-3">
      <div class="card stat-card border-primary">
        <div class="card-body text-center">
          <h5 class="card-title text-primary">إجمالي الأرباح</h5>
          <p class="display-6 fw-bold text-success" id="totalProfit">ر.س 0.00</p>
        </div>
      </div>
    </div>
    <div class="col-md-3 col-sm-6 mb-3">
      <div class="card stat-card border-success">
        <div class="card-body text-center">
          <h5 class="card-title text-success">عدد المعاملات</h5>
          <p class="display-6 fw-bold text-primary" id="totalReports">0</p>
        </div>
      </div>
    </div>
    <div class="col-md-3 col-sm-6 mb-3">
      <div class="card stat-card border-warning">
        <div class="card-body text-center">
          <h5 class="card-title text-warning">ما تم إكماله</h5>
          <p class="display-6 fw-bold text-danger" id="completedCount">0</p>
        </div>
      </div>
    </div>
    <div class="col-md-3 col-sm-6 mb-3">
      <div class="card stat-card border-info">
        <div class="card-body text-center">
          <h5 class="card-title text-info">متوسط الربح</h5>
          <p class="display-6 fw-bold" id="avgProfit">ر.س 0.00</p>
        </div>
      </div>
    </div>
  </div>

  <!-- عوامل التصفية -->
  <div class="row mb-4">
    <div class="col-12">
      <div class="filter-section">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label fw-bold">حالة الحجز</label>
            <select class="form-select" id="statusFilter">
              <option value="">الكل</option>
              <option value="مكتمل">مكتمل</option>
              <option value="قيد التنفيذ">قيد التنفيذ</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold">من تاريخ</label>
            <input type="date" class="form-control" id="startDate">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold">إلى تاريخ</label>
            <input type="date" class="form-control" id="endDate">
          </div>
          <div class="col-md-3 d-flex align-items-end">
            <button class="btn btn-primary w-100" id="applyFilters">تطبيق التصفية</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- الجدول + المخطط -->
  <div class="row">
    <div class="col-lg-8 mb-4">
      <div class="card border-0">
        <div class="card-header bg-white py-3">
          <h5 class="mb-0 fw-bold text-primary">📋 تفاصيل التقارير</h5>
        </div>
        <div class="card-body table-responsive">
          <table class="table table-hover" id="reportsTable">
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>الموظف</th>
                <th>فاتورتنا</th>
                <th>ربحنا</th>
                <th>الحالة</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">جاري التحميل...</span></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-lg-4 mb-4">
      <div class="card border-0 h-100">
        <div class="card-header bg-white py-3">
          <h5 class="mb-0 fw-bold text-primary">📈 تحليل الأرباح</h5>
        </div>
        <div class="card-body">
          <canvas id="profitChart"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- نافذة منبثقة -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">تفاصيل التقرير</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycby8a-7ev-P9Rib8w52yAFGiBJZVK5zjJ_7JqAE4-y-rkRKKazrCPHsb_O7mBi7CEgUzCg/exec";
let reportsData = [];
let activeData = [];
let dataTable = null;

// --- تسجيل الدخول ---
document.getElementById('loginBtn').onclick = async function(){
  const pwd = document.getElementById('passwordInput').value.trim();
  if(!pwd) return;
  try{
    const res = await fetch(`${API_URL}?password=${encodeURIComponent(pwd)}`);
    const data = await res.json();
    if(data.error){ document.getElementById('loginError').textContent="كلمة المرور خاطئة 🔑"; return; }
    document.getElementById('loginDiv').style.display="none";
    document.getElementById('contentDiv').style.display="block";
    reportsData = data;
    activeData = [...data];
    renderAll();
  }catch(err){
    console.error(err);
    document.getElementById('loginError').textContent="فشل الاتصال بالخادم";
  }
};

// --- مساعدة ---
function parseCurrency(str){ return Number(String(str||0).replace(/[^0-9.]/g,''))||0; }
function parseDateString(s){ if(!s) return new Date(NaN); const parts = s.split(/[-\/]/); return new Date(parts[2],parts[1]-1,parts[0]||parts[0]); }

// --- الإحصائيات ---
function updateStats(data){
  const totalProfit = data.reduce((sum,i)=>sum+parseCurrency(i.totalProfit),0);
  const completedCount = data.filter(i=>i.status==='مكتمل').length;
  const avgProfit = data.length>0? totalProfit/data.length : 0;
  document.getElementById('totalProfit').textContent = `ر.س ${totalProfit.toLocaleString('ar-SA',{minimumFractionDigits:2})}`;
  document.getElementById('totalReports').textContent = data.length;
  document.getElementById('completedCount').textContent = completedCount;
  document.getElementById('avgProfit').textContent = `ر.س ${avgProfit.toLocaleString('ar-SA',{minimumFractionDigits:2})}`;
}

// --- جدول + روابط ---
function renderTable(data){
  const tbody=document.getElementById('tableBody');
  tbody.innerHTML = data.map((item,index)=>`
    <tr>
      <td><a onclick="showDetails(${index})">${item.date}</a></td>
      <td><a onclick="showEmployee(${index})">${item.employee}</a></td>
      <td><a onclick="showDetails(${index})">ر.س ${parseCurrency(item.ourInvoiceValue).toLocaleString('ar-SA')}</a></td>
      <td class="text-success fw-bold">ر.س ${parseCurrency(item.ourProfit).toLocaleString('ar-SA')}</td>
      <td><span class="badge badge-status bg-${item.status==='مكتمل'?'success':'warning'} text-dark">${item.status}</span></td>
    </tr>`).join('');
  if(dataTable) dataTable.destroy();
  dataTable = $('#reportsTable').DataTable({language:{url:"//cdn.datatables.net/plug-ins/1.13.6/i18n/ar.json"},order:[[0,'desc']],pageLength:10,responsive:true});
}

// --- رسم المخطط ---
function renderChart(){
  const ctx=document.getElementById('profitChart').getContext('2d');
  if(window.profitChart) try{ window.profitChart.destroy(); }catch(e){}
  const prepared=activeData.map(r=>({label:r.date,value:parseCurrency(r.totalProfit)})).filter(x=>!isNaN(parseDateString(x.label)));
  const labels=prepared.map(p=>p.label); const values=prepared.map(p=>p.value);
  window.profitChart=new Chart(ctx,{type:'bar',data:{labels, datasets:[{label:'الأرباح (ر.س)', data:values, backgroundColor:'rgba(54,162,235,0.7)', borderColor:'rgb(54,162,235)', borderWidth:1}]},options:{responsive:true, maintainAspectRatio:false, scales:{y:{beginAtZero:true,title:{display:true,text:'القيمة (ر.س)'}},x:{title:{display:true,text:'التاريخ'}}}}});
}

// --- عرض التفاصيل ---
function showDetails(index){
  const item = activeData[index];
  const html = `
    <ul class="list-group">
      <li class="list-group-item"><b>تاريخ التأكيد:</b> ${item.date}</li>
      <li class="list-group-item"><b>الموظف:</b> ${item.employee}</li>
      <li class="list-group-item"><b>رقم فاتورتنا:</b> ${item.ourInvoiceNo}</li>
      <li class="list-group-item"><b>قيمة الفاتورة:</b> ر.س ${parseCurrency(item.ourInvoiceValue).toLocaleString('ar-SA')}</li>
      <li class="list-group-item"><b>رقم الحجز:</b> ${item.hotelBookingNo}</li>
      <li class="list-group-item"><b>قيمة فاتورة الفندق:</b> ر.س ${parseCurrency(item.hotelInvoiceValue).toLocaleString('ar-SA')}</li>
      <li class="list-group-item"><b>إجمالي المكسب:</b> ر.س ${parseCurrency(item.totalProfit).toLocaleString('ar-SA')}</li>
      <li class="list-group-item"><b>أرباحنا:</b> ر.س ${parseCurrency(item.ourProfit).toLocaleString('ar-SA')}</li>
      <li class="list-group-item"><b>نسبة الموظف:</b> ر.س ${parseCurrency(item.employeeShare).toLocaleString('ar-SA')}</li>
      <li class="list-group-item"><b>الملاحظات:</b> ${item.notes||'-'}</li>
      <li class="list-group-item"><b>الحالة:</b> ${item.status}</li>
    </ul>`;
  document.getElementById('modalBody').innerHTML = html;
  new bootstrap.Modal(document.getElementById('detailModal')).show();
}

// --- عرض أرباح الموظف ---
function showEmployee(index){
  const item = activeData[index];
  const html = `<p><b>أرباح الموظف:</b> ر.س ${parseCurrency(item.employeeShare).toLocaleString('ar-SA')}</p>
                <p><b>أرباحنا:</b> ر.س ${parseCurrency(item.ourProfit).toLocaleString('ar-SA')}</p>`;
  document.getElementById('modalBody').innerHTML = html;
  new bootstrap.Modal(document.getElementById('detailModal')).show();
}

// --- تحديث كل شيء ---
function renderAll(){ updateStats(activeData); renderTable(activeData); renderChart(); }

// --- تطبيق الفلتر ---
document.getElementById('applyFilters').onclick=function(){
  const status=document.getElementById('statusFilter').value;
  const start=document.getElementById('startDate').value;
  const end=document.getElementById('endDate').value;
  activeData=[...reportsData];
  if(status) activeData=activeData.filter(i=>i.status===status);
  if(start && end) activeData=activeData.filter(i=>{const d=parseDateString(i.date); return d>=parseDateString(start) && d<=parseDateString(end);});
  renderAll();
};
</script>

</body>
</html>
