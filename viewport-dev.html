<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة التقارير والمبيعات</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="sales-report-app-root"></div>

<script>
(function() {
    const rootElement = document.getElementById('sales-report-app-root');
    if (!rootElement) return;

    const shadow = rootElement.attachShadow({ mode: 'open' });

    const styles = `
        @import url('https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css');
        
        :host {
            display: block;
            direction: rtl;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container { max-width: 1400px; margin: 0 auto; }
        .sales-card { border-radius:15px; border:none; box-shadow:0 2px 12px rgba(0,0,0,0.06); margin-bottom:20px; background: white; padding: 20px; }
        .header-bg { background: linear-gradient(135deg,#0d6efd 0%,#0a58ca 100%); color:white; border-radius: 15px !important; text-align: center; padding: 25px; margin-bottom: 25px; }
        .clickable-link { cursor: pointer; text-decoration: underline; color: #0d6efd; transition: 0.2s; }
        .clickable-link:hover { color: #0a58ca; font-weight: bold; }
        
        .badge-status { padding:6px 12px; border-radius:30px; font-weight:500; font-size:0.8rem; display: inline-block; }
        .bg-success { background-color: #198754; color: white; }
        .bg-warning { background-color: #ffc107; color: #212529; }
        .bg-danger { background-color: #dc3545; color: white; }
        .bg-secondary { background-color: #6c757d; color: white; }
        .bg-info { background-color: #0dcaf0; color: #212529; }
        .bg-dark { background-color: #212529; color: white; }

        .stat-card { flex: 1; min-width: 220px; border-right: 5px solid #eee; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-label { color: #6c757d; font-size: 0.9rem; margin-bottom: 8px; display: block; }
        .stat-value { font-size: 1.6rem; font-weight: 700; margin: 0; }

        .filter-section { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .filter-group { flex: 1; min-width: 180px; }
        .filter-label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: #444; }
        .filter-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #dee2e6; font-family: inherit; }
        .filter-btn { padding: 10px 30px; background: #212529; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .filter-btn:hover { background: #000; }

        .chart-container { width: 100%; height: 350px; position: relative; }

        .custom-popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 10000;
            backdrop-filter: blur(4px);
        }
        .custom-popup-content {
            background: white; padding: 30px; border-radius: 20px; max-width: 700px; width: 90%;
            position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.3); animation: slideUp 0.3s ease-out;
            max-height: 90vh; overflow-y: auto;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .close-popup {
            position: absolute; top: 20px; left: 20px; font-size: 28px; cursor: pointer; color: #adb5bd; line-height: 1;
        }
        .close-popup:hover { color: #495057; }
        
        .login-box { max-width: 400px; margin: 80px auto; text-align: center; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #f1f3f5; }
        th { background: #f8f9fa; color: #495057; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; }
        tr:hover td { background-color: #fcfcfc; }
        
        .history-table th, .history-table td { padding: 10px; font-size: 0.9rem; }
        
        @media (max-width: 768px) {
            .stat-card { min-width: 45%; }
            .filter-group { min-width: 100%; }
        }
    `;

    const html = `
        <div class="app-container">
            <!-- Login -->
            <div id="loginSection" class="sales-card login-box">
                <h2 style="color: #0d6efd; margin-bottom: 12px;">تسجيل الدخول</h2>
                <p style="color: #6c757d; margin-bottom: 30px;">نظام التقارير المالية المتكامل</p>
                <input type="password" id="passInput" class="form-control" placeholder="أدخل كلمة المرور">
                <button id="loginBtn" style="width: 100%; padding: 14px; background: #0d6efd; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;">دخول النظام</button>
                <div id="loginErr" style="color: #dc3545; margin-top: 20px; font-weight: 600; font-size: 0.9rem;"></div>
            </div>

            <!-- Dashboard Content -->
            <div id="mainContent" style="display: none;">
                <div class="header-bg">
                    <h1 style="margin: 0; font-weight: 800; letter-spacing: -1px;">📊 لوحة التحكم والتقارير</h1>
                </div>

                <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 25px;">
                    <div class="sales-card stat-card" style="border-right-color: #198754;">
                        <span class="stat-label">💰 إجمالي الأرباح</span>
                        <h2 id="statTotalProfit" class="stat-value" style="color: #198754;">0.00</h2>
                    </div>
                    <div class="sales-card stat-card" style="border-right-color: #0d6efd;">
                        <span class="stat-label">🤝 عمولات الموظفين</span>
                        <h2 id="statEmployeeShare" class="stat-value" style="color: #0d6efd;">0.00</h2>
                    </div>
                    <div class="sales-card stat-card" style="border-right-color: #0dcaf0;">
                        <span class="stat-label">📈 صافي ربحنا</span>
                        <h2 id="statOurProfit" class="stat-value" style="color: #0dcaf0;">0.00</h2>
                    </div>
                    <div class="sales-card stat-card" style="border-right-color: #ffc107;">
                        <span class="stat-label">⏳ قيد التنفيذ</span>
                        <h2 id="statPending" class="stat-value" style="color: #ffc107;">0</h2>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-8">
                        <div class="sales-card">
                            <div class="filter-section" style="margin-bottom: 20px;">
                                <div class="filter-group">
                                    <label class="filter-label">الحالة</label>
                                    <select id="filterStatus" class="filter-input">
                                        <option value="">عرض الكل</option>
                                        <option>مكتمل</option>
                                        <option>قيد التنفيذ</option>
                                        <option>ملغي</option>
                                    </select>
                                </div>
                                <div class="filter-group">
                                    <label class="filter-label">من تاريخ</label>
                                    <input type="date" id="startDate" class="filter-input">
                                </div>
                                <div class="filter-group">
                                    <label class="filter-label">إلى تاريخ</label>
                                    <input type="date" id="endDate" class="filter-input">
                                </div>
                                <button id="applyFilter" class="filter-btn">تطبيق</button>
                            </div>
                            <div style="overflow-x: auto; padding: 0;">
                                <table id="mainTable">
                                    <thead>
                                        <tr>
                                            <th>رقم الفاتورة</th>
                                            <th>الموظف</th>
                                            <th>التاريخ</th>
                                            <th>الربح</th>
                                            <th>الحالة</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="sales-card">
                            <h5 style="margin-bottom: 20px; font-weight: 700; color: #495057;">📈 أداء الأرباح</h5>
                            <div class="chart-container">
                                <canvas id="profitChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Popup Internal -->
        <div id="popupOverlay" class="custom-popup-overlay">
            <div class="custom-popup-content">
                <span id="closePopup" class="close-popup">&times;</span>
                <h3 id="popupTitle" style="margin-top: 0; color: #0d6efd; border-bottom: 2px solid #f8f9fa; padding-bottom: 15px; font-weight: 700;"></h3>
                <div id="popupBody" style="margin-top: 25px;"></div>
            </div>
        </div>
    `;

    const styleTag = document.createElement('style');
    styleTag.textContent = styles;
    shadow.appendChild(styleTag);

    const container = document.createElement('div');
    container.innerHTML = html;
    shadow.appendChild(container);

    const API_URL = "https://script.google.com/macros/s/AKfycby8a-7ev-P9Rib8w52yAFGiBJZVK5zjJ_7JqAE4-y-rkRKKazrCPHsb_O7mBi7CEgUzCg/exec";
    let allData = [];
    let filteredData = [];
    let myChart = null;

    const $ = (id) => shadow.getElementById(id);
    const formatSAR = (n) => Number(n || 0).toLocaleString('ar-SA', { style: 'currency', currency: 'SAR' });
    const parseNum = (str) => Number(String(str || 0).replace(/[^0-9.-]+/g,"")) || 0;

    function parseDate(dateStr) {
        if (!dateStr) return null;
        const parts = dateStr.split(/[-/]/);
        if (parts.length === 3) {
            if (parts[2].length === 4) return new Date(parts[2], parts[1]-1, parts[0]);
            return new Date(parts[0], parts[1]-1, parts[2]);
        }
        return new Date(dateStr);
    }

    $('loginBtn').onclick = async () => {
        const pass = $('passInput').value;
        if (!pass) return;
        $('loginBtn').innerText = "جاري التحقق...";
        $('loginBtn').disabled = true;
        try {
            const res = await fetch(`${API_URL}?password=${encodeURIComponent(pass)}`);
            const data = await res.json();
            if (data.error) throw new Error("كلمة مرور خاطئة");
            allData = data;
            filteredData = [...data];
            $('loginSection').style.display = 'none';
            $('mainContent').style.display = 'block';
            renderUI();
        } catch (e) {
            $('loginErr').innerText = "❌ عذراً: كلمة المرور غير صحيحة";
            $('loginBtn').innerText = "دخول النظام";
            $('loginBtn').disabled = false;
        }
    };

    function renderUI() {
        const totalProfit = filteredData.reduce((s, i) => s + parseNum(i.totalProfit), 0);
        const employeeShare = filteredData.reduce((s, i) => s + parseNum(i.employeeShare), 0);
        const ourProfit = filteredData.reduce((s, i) => s + parseNum(i.ourProfit), 0);
        const pendingCount = filteredData.filter(i => i.status === 'قيد التنفيذ').length;

        $('statTotalProfit').innerText = formatSAR(totalProfit);
        $('statEmployeeShare').innerText = formatSAR(employeeShare);
        $('statOurProfit').innerText = formatSAR(ourProfit);
        $('statPending').innerText = pendingCount;

        $('tableBody').innerHTML = filteredData.map((item, idx) => `
            <tr>
                <td><span class="clickable-link" data-idx="${idx}" data-type="invoice">${item.ourInvoiceNo ? '#' + item.ourInvoiceNo : '---'}</span></td>
                <td><span class="clickable-link" style="color: #333; text-decoration: none;" data-idx="${idx}" data-type="employee">👤 ${item.employee}</span></td>
                <td>${item.date}</td>
                <td style="color: #198754; font-weight: 700;">${formatSAR(item.ourProfit)}</td>
                <td><span class="badge-status bg-${getStatusColor(item.status)}">${item.status}</span></td>
            </tr>
        `).join('');

        shadow.querySelectorAll('.clickable-link').forEach(link => {
            link.onclick = () => {
                const idx = link.getAttribute('data-idx');
                const type = link.getAttribute('data-type');
                if (type === 'invoice') showInvoice(idx);
                else showEmployee(idx);
            };
        });

        updateChart();
    }

    function updateChart() {
        const ctx = $('profitChart').getContext('2d');
        if (myChart) myChart.destroy();

        const chartData = filteredData.slice(0, 10).reverse();
        
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: chartData.map(d => d.date),
                datasets: [{
                    label: 'صافي الربح',
                    data: chartData.map(d => parseNum(d.ourProfit)),
                    borderColor: '#0d6efd',
                    backgroundColor: 'rgba(13, 110, 253, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#0d6efd',
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#f1f3f5' } },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    function getStatusColor(s) {
        switch (s) {
            case 'مكتمل': return 'success';
            case 'قيد التنفيذ': return 'warning';
            case 'ملغي': return 'danger';
            default: return 'secondary';
        }
    }

    function showPopup(title, content) {
        $('popupTitle').innerText = title;
        $('popupBody').innerHTML = content;
        $('popupOverlay').style.display = 'flex';
    }

    $('closePopup').onclick = () => $('popupOverlay').style.display = 'none';
    $('popupOverlay').onclick = (e) => { if (e.target === $('popupOverlay')) $('popupOverlay').style.display = 'none'; };

    function showInvoice(idx) {
        const d = filteredData[idx];
        showPopup("🧾 تفاصيل الفاتورة الكاملة", `
            <div style="display: grid; gap: 15px;">
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #f1f3f5; padding-bottom: 10px;">
                    <span style="color: #6c757d;">رقم الفاتورة:</span> <b style="color:#0d6efd">#${d.ourInvoiceNo || '-'}</b>
                </div>
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #f1f3f5; padding-bottom: 10px;">
                    <span style="color: #6c757d;">رقم الحجز:</span> <b>${d.hotelBookingNo || '-'}</b>
                </div>
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #f1f3f5; padding-bottom: 10px;">
                    <span style="color: #6c757d;">التاريخ:</span> <b>${d.date}</b>
                </div>
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #f1f3f5; padding-bottom: 10px;">
                    <span style="color: #6c757d;">اسم الموظف:</span> <b>${d.employee}</b>
                </div>
                <hr style="margin: 5px 0; border: none; border-top: 1px solid #eee;">
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: #6c757d;">قيمة الفاتورة لدينا:</span> <b>${formatSAR(d.ourInvoiceValue)}</b>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: #6c757d;">قيمة فاتورة الفندق:</span> <b>${formatSAR(d.hotelInvoiceValue)}</b>
                </div>
                <div style="display: flex; justify-content: space-between; background: #e8f5e9; padding: 10px; border-radius: 8px;">
                    <span style="color: #2e7d32; font-weight: bold;">إجمالي الربح:</span> <b style="color:#1b5e20">${formatSAR(d.totalProfit)}</b>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: #6c757d;">عمولة الموظف:</span> <b>${formatSAR(d.employeeShare)}</b>
                </div>
                <div style="display: flex; justify-content: space-between; border-top: 2px solid #e7f3ff; padding-top: 10px;">
                    <span style="color: #0d6efd; font-weight: bold;">صافي ربحنا:</span> <b style="color:#0a58ca">${formatSAR(d.ourProfit)}</b>
                </div>
                <div style="margin-top: 10px; background: #fff8e1; padding: 15px; border-radius: 10px; border: 1px solid #ffe082;">
                    <small style="display: block; color: #f57f17; font-weight: bold; margin-bottom: 5px;">ملاحظات الفاتورة:</small>
                    <p style="margin: 0; font-size: 0.9rem; color: #5d4037;">${d.notes || 'لا توجد ملاحظات لهذه الفاتورة'}</p>
                </div>
                <div style="text-align: center; margin-top: 10px;">
                    <span class="badge-status bg-${getStatusColor(d.status)}">${d.status}</span>
                </div>
            </div>
        `);
    }

    function showEmployee(idx) {
        const employeeName = filteredData[idx].employee;
        const currentItem = filteredData[idx];
        
        // جلب جميع عمليات الموظف من البيانات المعروضة حالياً (بناءً على الفلتر)
        const employeeHistory = filteredData.filter(i => i.employee === employeeName);
        const totalCommissions = employeeHistory.reduce((s, i) => s + parseNum(i.employeeShare), 0);

        let historyHtml = `
            <div style="margin-top: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #f0f7ff; padding: 15px; border-radius: 12px; border: 1px solid #cde5ff;">
                    <div>
                        <span style="color: #6c757d; font-size: 0.85rem;">العمولة الحالية لهذه الفاتورة:</span>
                        <h3 style="color: #0d6efd; margin: 5px 0;">${formatSAR(currentItem.employeeShare)}</h3>
                    </div>
                    <div style="text-align: left;">
                        <span style="color: #6c757d; font-size: 0.85rem;">إجمالي العمولات (حسب الفلتر):</span>
                        <h3 style="color: #198754; margin: 5px 0;">${formatSAR(totalCommissions)}</h3>
                    </div>
                </div>
                
                <h5 style="margin-bottom: 15px; font-weight: bold; color: #495057;">📊 سجل عمولات الموظف (${employeeHistory.length} عملية):</h5>
                <div style="max-height: 300px; overflow-y: auto; border: 1px solid #f1f3f5; border-radius: 10px;">
                    <table class="history-table" style="margin-top: 0;">
                        <thead style="position: sticky; top: 0; z-index: 1;">
                            <tr>
                                <th>الفاتورة</th>
                                <th>التاريخ</th>
                                <th>العمولة</th>
                                <th>الحالة</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${employeeHistory.map(h => `
                                <tr>
                                    <td style="color: #0d6efd;">#${h.ourInvoiceNo || '---'}</td>
                                    <td>${h.date}</td>
                                    <td style="font-weight: bold; color: #198754;">${formatSAR(h.employeeShare)}</td>
                                    <td><span class="badge-status bg-${getStatusColor(h.status)}" style="font-size: 0.7rem; padding: 4px 8px;">${h.status}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;

        showPopup(`👤 سجل عمولات: ${employeeName}`, historyHtml);
    }

    $('applyFilter').onclick = () => {
        const status = $('filterStatus').value;
        const startVal = $('startDate').value;
        const endVal = $('endDate').value;

        filteredData = allData.filter(item => {
            let pass = true;
            if (status && item.status !== status) pass = false;
            if (startVal && endVal) {
                const itemDate = parseDate(item.date);
                const start = new Date(startVal);
                const end = new Date(endVal);
                if (!itemDate || itemDate < start || itemDate > end) pass = false;
            }
            return pass;
        });
        renderUI();
    };

})();
</script>

</body>
</html>
