<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة التقارير والمبيعات</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<style>
    body { background:#f0f2f5; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #loginDiv { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:100%; max-width:400px; }
    #contentDiv { display:none; }
    #profitChart { width:100%; height:350px !important; }
    .card { border-radius:15px; border:none; box-shadow:0 2px 15px rgba(0,0,0,0.05); margin-bottom:20px; }
    .header-bg { background: linear-gradient(135deg,#0d6efd 0%,#0a58ca 100%); color:white; border-radius: 15px !important; }
    .clickable-link { cursor: pointer; text-decoration: underline; transition: 0.3s; }
    .clickable-link:hover { color: #0a58ca; font-weight: bold; }
    
    /* تنسيق الحالات */
    .badge-status { padding:8px 12px; border-radius:30px; font-weight:500; font-size:0.85rem; }
    .bg-gray { background-color: #6c757d; color: white; }
    
    /* تحسينات الجدول */
    table.dataTable thead th { background-color: #f8f9fa; border-bottom: 2px solid #dee2e6; }
</style>
</head>
<body>

<div id="loginDiv" class="card p-4">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">تسجيل الدخول</h2>
        <p class="text-muted">نظام التقارير المالية</p>
    </div>
    <input type="password" id="passwordInput" class="form-control mb-3 p-3" placeholder="أدخل كلمة المرور">
    <button id="loginBtn" class="btn btn-primary w-100 p-2 fw-bold">دخول النظام</button>
    <p id="loginError" class="text-danger mt-3 text-center fw-bold"></p>
</div>

<div id="contentDiv" class="container-fluid py-4">

    <div class="row mb-4">
        <div class="col-12">
            <div class="card header-bg p-4 text-center">
                <h1 class="fw-bold mb-0">📊 لوحة التحكم والتقارير</h1>
            </div>
        </div>
    </div>

    <div class="row mb-4 g-3">
        <div class="col-md-3 col-6">
            <div class="card h-100 p-3 text-center border-start border-4 border-success">
                <h6 class="text-muted">إجمالي الأرباح</h6>
                <h3 class="fw-bold text-success" id="totalProfit">0.00</h3>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card h-100 p-3 text-center border-start border-4 border-primary">
                <h6 class="text-muted">عدد المعاملات</h6>
                <h3 class="fw-bold text-primary" id="totalReports">0</h3>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card h-100 p-3 text-center border-start border-4 border-warning">
                <h6 class="text-muted">قيد التنفيذ</h6>
                <h3 class="fw-bold text-warning" id="pendingCount">0</h3>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card h-100 p-3 text-center border-start border-4 border-danger">
                <h6 class="text-muted">الملغاة</h6>
                <h3 class="fw-bold text-danger" id="cancelledCount">0</h3>
            </div>
        </div>
    </div>

    <div class="card p-3 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label fw-bold">تصفية حسب الحالة</label>
                <select class="form-select" id="statusFilter">
                    <option value="">عرض الكل</option>
                    <option value="مكتمل">مكتمل</option>
                    <option value="قيد التنفيذ">قيد التنفيذ</option>
                    <option value="ملغي">ملغي</option>
                    <option value="لم يتم إنشاء فاتورة">لم يتم إنشاء فاتورة</option>
                    <option value="لم يتم تعين رقم الحجز">لم يتم تعين رقم الحجز</option>
                    <option value="لم يتم التحويل للفندق">لم يتم التحويل للفندق</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold">من تاريخ</label>
                <input type="date" class="form-control" id="startDate">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold">إلى تاريخ</label>
                <input type="date" class="form-control" id="endDate">
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary w-100 fw-bold" id="applyFilters">تطبيق الفلتر</button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8 mb-4">
            <div class="card h-100">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold text-dark">📝 سجل الفواتير</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle" id="reportsTable">
                            <thead class="table-light">
                                <tr>
                                    <th>رقم الفاتورة</th>
                                    <th>الموظف</th>
                                    <th>التاريخ</th>
                                    <th>أرباحنا</th>
                                    <th>الحالة</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr><td colspan="5" class="text-center py-5">جاري تحميل البيانات...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4 mb-4">
            <div class="card h-100">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold text-dark">📈 الأداء المالي</h5>
                </div>
                <div class="card-body">
                    <canvas id="profitChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="infoModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold" id="modalTitle">التفاصيل</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4" id="modalBody">
                </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="modal">إغلاق</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// رابط السكربت الخاص بك
const API_URL = "https://script.google.com/macros/s/AKfycby8a-7ev-P9Rib8w52yAFGiBJZVK5zjJ_7JqAE4-y-rkRKKazrCPHsb_O7mBi7CEgUzCg/exec";

let allData = [];
let filteredData = [];
let dataTableInstance = null;

// دوال مساعدة للأرقام والتواريخ
const formatMoney = (amount) => Number(amount || 0).toLocaleString('ar-SA', { style: 'currency', currency: 'SAR' });
const parseNum = (str) => Number(String(str || 0).replace(/[^0-9.-]+/g,"")) || 0;
function parseDate(dateStr) {
    if (!dateStr) return null;
    // التعامل مع تنسيق التاريخ DD/MM/YYYY أو YYYY-MM-DD
    const parts = dateStr.split(/[-/]/);
    if (parts.length === 3) {
        // افتراض التنسيق هو يوم/شهر/سنة إذا كانت السنة في الأخير
        if (parts[2].length === 4) return new Date(parts[2], parts[1]-1, parts[0]);
        return new Date(parts[0], parts[1]-1, parts[2]);
    }
    return new Date(dateStr);
}

// 1. تسجيل الدخول
document.getElementById('loginBtn').addEventListener('click', async () => {
    const pwd = document.getElementById('passwordInput').value.trim();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    
    if(!pwd) return;
    
    btn.disabled = true;
    btn.textContent = "جاري التحقق...";
    err.textContent = "";

    try {
        const response = await fetch(`${API_URL}?password=${encodeURIComponent(pwd)}`);
        const result = await response.json();
        
        if (result.error) {
            err.textContent = "❌ كلمة المرور غير صحيحة";
            btn.disabled = false;
            btn.textContent = "دخول النظام";
        } else {
            document.getElementById('loginDiv').style.display = "none";
            document.getElementById('contentDiv').style.display = "block";
            allData = result;
            filteredData = [...allData];
            updateDashboard();
        }
    } catch (e) {
        console.error(e);
        err.textContent = "حدث خطأ في الاتصال بالخادم";
        btn.disabled = false;
        btn.textContent = "دخول النظام";
    }
});

// 2. تحديد لون الحالة (مهم جداً حسب طلبك)
function getStatusBadge(status) {
    let colorClass = 'secondary'; // الافتراضي
    let icon = '';

    switch (status) {
        case 'مكتمل':
            colorClass = 'success';
            icon = '✅';
            break;
        case 'قيد التنفيذ':
            colorClass = 'warning text-dark';
            icon = '⏳';
            break;
        case 'ملغي':
            colorClass = 'danger';
            icon = '❌';
            break;
        case 'لم يتم إنشاء فاتورة':
            colorClass = 'secondary';
            break;
        case 'لم يتم تعين رقم الحجز':
            colorClass = 'info text-dark';
            break;
        case 'لم يتم التحويل للفندق':
            colorClass = 'dark';
            break;
    }
    return `<span class="badge badge-status bg-${colorClass}">${icon} ${status}</span>`;
}

// 3. تحديث الإحصائيات
function updateStats() {
    const totalProfit = filteredData.reduce((sum, item) => sum + parseNum(item.totalProfit), 0);
    const pending = filteredData.filter(i => i.status === 'قيد التنفيذ').length;
    const cancelled = filteredData.filter(i => i.status === 'ملغي').length;

    document.getElementById('totalProfit').textContent = formatMoney(totalProfit);
    document.getElementById('totalReports').textContent = filteredData.length;
    document.getElementById('pendingCount').textContent = pending;
    document.getElementById('cancelledCount').textContent = cancelled;
}

// 4. بناء الجدول (الجزء الأساسي للتعديلات)
function renderTable() {
    // تدمير الجدول القديم إذا وجد
    if (dataTableInstance) {
        dataTableInstance.destroy();
    }

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = filteredData.map((item, index) => {
        // ملاحظة: نستخدم index الخاص بـ filteredData مباشرة للوصول للبيانات عند النقر
        // رقم الفاتورة: عند الضغط تظهر تفاصيل الفاتورة
        // اسم الموظف: عند الضغط تظهر العمولة
        return `
            <tr>
                <td>
                    <a class="clickable-link text-primary" onclick="showInvoiceDetails(${index})">
                        ${item.ourInvoiceNo ? '#' + item.ourInvoiceNo : 'بدون رقم'}
                    </a>
                </td>
                <td>
                    <a class="clickable-link text-dark" onclick="showEmployeeCommission(${index})">
                        👤 ${item.employee}
                    </a>
                </td>
                <td>${item.date}</td>
                <td class="fw-bold text-success">${formatMoney(item.ourProfit)}</td>
                <td>${getStatusBadge(item.status)}</td>
            </tr>
        `;
    }).join('');

    // تفعيل DataTables
    dataTableInstance = $('#reportsTable').DataTable({
        language: { url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/ar.json" },
        order: [[2, 'desc']], // ترتيب حسب التاريخ افتراضيا
        responsive: true,
        pageLength: 10
    });
}

// 5. وظيفة إظهار تفاصيل الفاتورة (عند الضغط على رقم الفاتورة)
window.showInvoiceDetails = function(index) {
    const item = filteredData[index];
    const html = `
        <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between">
                <span>رقم الفاتورة:</span> <span class="fw-bold text-primary">${item.ourInvoiceNo || '-'}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
                <span>التاريخ:</span> <span>${item.date}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
                <span>رقم الحجز:</span> <span>${item.hotelBookingNo || '-'}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
                <span>قيمة فاتورتنا:</span> <span>${formatMoney(item.ourInvoiceValue)}</span>
            </li>
             <li class="list-group-item d-flex justify-content-between">
                <span>قيمة فاتورة الفندق:</span> <span>${formatMoney(item.hotelInvoiceValue)}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between bg-light">
                <span>إجمالي الربح:</span> <span class="fw-bold text-success">${formatMoney(item.totalProfit)}</span>
            </li>
            <li class="list-group-item">
                <strong>الملاحظات:</strong><br>
                <p class="text-muted small mt-1">${item.notes || 'لا يوجد ملاحظات'}</p>
            </li>
            <li class="list-group-item text-center">
                ${getStatusBadge(item.status)}
            </li>
        </ul>
    `;
    document.getElementById('modalTitle').textContent = "🧾 تفاصيل الفاتورة الكاملة";
    document.getElementById('modalBody').innerHTML = html;
    new bootstrap.Modal(document.getElementById('infoModal')).show();
};

// 6. وظيفة إظهار عمولة الموظف فقط (عند الضغط على اسم الموظف)
window.showEmployeeCommission = function(index) {
    const item = filteredData[index];
    const html = `
        <div class="text-center py-4">
            <h5 class="text-muted mb-3">عمولة الموظف: <span class="text-dark fw-bold">${item.employee}</span></h5>
            <h1 class="display-4 text-success fw-bold mb-3">${formatMoney(item.employeeShare)}</h1>
            <p class="text-muted">من أصل ربحنا: ${formatMoney(item.ourProfit)}</p>
        </div>
    `;
    document.getElementById('modalTitle').textContent = "💰 عمولة الموظف";
    document.getElementById('modalBody').innerHTML = html;
    new bootstrap.Modal(document.getElementById('infoModal')).show();
};

// 7. رسم المخطط
function renderChart() {
    const ctx = document.getElementById('profitChart').getContext('2d');
    if (window.myChart) window.myChart.destroy();
    
    // تجميع الأرباح حسب التاريخ (أول 15 سجل فقط لجمالية المخطط)
    const chartData = filteredData.slice(0, 15).reverse();
    
    window.myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: chartData.map(d => d.date),
            datasets: [{
                label: 'صافي الربح',
                data: chartData.map(d => parseNum(d.totalProfit)),
                backgroundColor: 'rgba(13, 110, 253, 0.7)',
                borderColor: '#0d6efd',
                borderWidth: 1,
                borderRadius: 5
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { beginAtZero: true, grid: { display: true, color: '#f0f0f0' } },
                x: { grid: { display: false } }
            }
        }
    });
}

// دالة التحديث الشامل
function updateDashboard() {
    updateStats();
    renderTable();
    renderChart();
}

// 8. زر تفعيل الفلتر
document.getElementById('applyFilters').addEventListener('click', () => {
    const statusVal = document.getElementById('statusFilter').value;
    const startVal = document.getElementById('startDate').value;
    const endVal = document.getElementById('endDate').value;

    filteredData = allData.filter(item => {
        let pass = true;
        // فلتر الحالة
        if (statusVal && item.status !== statusVal) pass = false;
        
        // فلتر التاريخ
        if (startVal && endVal) {
            const itemDate = parseDate(item.date);
            const start = new Date(startVal);
            const end = new Date(endVal);
            if (!itemDate || itemDate < start || itemDate > end) pass = false;
        }
        return pass;
    });

    updateDashboard();
});

</script>
</body>
</html>
